<style>
/* ═══════════════════════════════════════════════════════════
   ATLAS HOMECARE — DESIGN TOKENS
   ═══════════════════════════════════════════════════════════ */
:root {
  /* ── Surface & Canvas ── */
  --color-canvas: #F6F8F9;
  --color-surface-0: #FFFFFF;
  --color-surface-1: #FFFFFF;
  --color-surface-2: #F1F4F6;
  --color-surface-3: #E8ECEF;
  --color-border-0: #E4E8EC;
  --color-border-1: #D6DCE2;
  --color-border-2: #C3CBD3;
  /* ── Ink ── */
  --color-ink-0: #17232B;   /* 16.0:1 on white  */
  --color-ink-1: #4E5D68;   /*  6.8:1 on white  */
  --color-ink-2: #5B6B76;   /*  5.5:1 on white  */
  --color-ink-3: #616F7A;   /*  5.2:1 on white  */
  /* ── Brand accent (deep teal — Atlas Life OS) ── */
  --color-accent: #0E7C86;        /* fills & borders: white on it = 4.95:1 */
  --color-accent-ink: #0A646C;    /* accent-coloured TEXT: 5.9:1 on accent-soft */
  --color-accent-h: #0B646C;
  --color-accent-soft: #E2F1F2;
  --color-accent-line: #B7DDE0;
  --color-brand-2: #3157D5;
  /* ── Functional status colors ── */
  --color-alert: #D6303B;        /* urgent / overdue */
  --color-alert-bg: #FDECEC;
  --color-warn: #E07A0C;         /* due soon */
  --color-warn-bg: #FDF2E3;
  --color-ok: #17864A;           /* done / stable */
  --color-ok-bg: #E6F4EC;
  --color-info: #2C62C4;         /* planned / informational */
  --color-info-bg: #E9EFFB;
  --color-muted: #7C8A94;        /* inactive / archived */
  --color-muted-bg: #EEF1F3;
  /* Text-on-tint variants (kept dark enough for small bold labels) */
  --color-alert-ink: #B3202B;
  --color-warn-ink: #8F5100;
  --color-ok-ink: #10643A;
  --color-info-ink: #23509F;
  --color-muted-ink: #56646E;
  /* ── Chart series (cost types) ── */
  --chart-maintenance: var(--color-accent);
  --chart-repair: var(--color-alert);
  --chart-appliance: var(--color-info);
  --chart-project: #7A5AF8;
  --chart-service: var(--color-warn);
  --chart-material: var(--color-ok);
  --chart-other: var(--color-muted);
  /* ── Typography ── */
  --fs-10: 10px; --fs-11: 11px; --fs-12: 12px; --fs-13: 13px; --fs-15: 15px;
  --fs-17: 17px; --fs-20: 20px; --fs-24: 24px; --fs-30: 30px; --fs-38: 38px;
  --lh-body: 1.55; --lh-head: 1.25;
  --ff-ui: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --ff-display: 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --ff-mono: ui-monospace, 'SFMono-Regular', 'Cascadia Mono', 'Menlo', monospace;
  /* ── Spacing (4/8 system) ── */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px;
  --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px; --s-16: 64px;
  /* ── Radii ── */
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 18px; --r-pill: 999px;
  --radius-card: 14px;
  /* ── Shadows ── */
  --shadow-soft: 0 1px 2px rgba(15, 35, 45, .05), 0 1px 3px rgba(15, 35, 45, .04);
  --shadow-card: 0 1px 2px rgba(15, 35, 45, .04), 0 6px 18px rgba(15, 35, 45, .05);
  --shadow-card-hover: 0 2px 6px rgba(15, 35, 45, .07), 0 12px 30px rgba(15, 35, 45, .09);
  --shadow-popover: 0 8px 28px rgba(15, 35, 45, .14);
  --shadow-modal: 0 24px 64px rgba(15, 35, 45, .22);
  /* ── Motion ── */
  --motion-fast: 110ms; --motion-med: 190ms; --motion-slow: 300ms;
  --ease-out: cubic-bezier(.22,.61,.36,1); --ease-inout: cubic-bezier(.6,.05,.3,.95);
  /* ── Layout ── */
  --topbar-h: 56px; --sidebar-w: 236px;
  --content-max: 1560px; --page-px: 28px;
}

[data-theme="dark"] {
  --color-canvas: #0E1117;
  --color-surface-0: #171B22;

  --color-ink-1: #A8B4BF;   /* 7.7:1 on surface-1 */
  --color-ink-2: #96A3AF;   /* 6.3:1 on surface-1 */
  --color-ink-3: #8A98A5;   /* 5.5:1 on surface-1 */
  --color-accent: #35B3B8;
  --color-accent-ink: #35B3B8;
  --color-accent-h: #4CC5C9;
  --color-accent-soft: #12333A;
  --color-accent-line: #1D4C55;
  --color-brand-2: #6E8BEB;
  --color-alert: #F06A6F;
  --color-alert-bg: rgba(240, 106, 111, .13);
  --color-warn: #F0A340;
  --color-warn-bg: rgba(240, 163, 64, .13);

}

@media (prefers-reduced-motion: reduce) {
  :root { --motion-fast: 0ms; --motion-med: 0ms; --motion-slow: 0ms; }
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--ff-ui);
  font-size: var(--fs-13);
  line-height: var(--lh-body);
  color: var(--color-ink-0);
  background: var(--color-canvas);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  display: flex; flex-direction: row;
  min-height: 100vh;
  min-height: 100svh;
  min-width: 320px;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--ff-display); font-weight: 600; line-height: var(--lh-head); margin: 0; letter-spacing: -.012em; }
a { color: var(--color-accent-ink); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; border-radius: var(--r-sm); }
::selection { background: var(--color-accent-soft); color: var(--color-ink-0); }
hr { border: none; border-top: 1px solid var(--color-border-0); margin: var(--s-4) 0; }

.skip-link {
  position: absolute; top: -100px; left: 8px; z-index: 10000;
  background: var(--color-accent); color: #fff; padding: 10px 14px;
  border-radius: var(--r-md); font-weight: 600; text-decoration: none;
  transition: top var(--motion-fast) ease;
}
.skip-link:focus { top: 8px; }

/* ═══════════════════════════════════════════════════════════
   SIDEBAR
   ═══════════════════════════════════════════════════════════ */
#sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--color-surface-0);
  border-right: 1px solid var(--color-border-0);
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh; position: sticky; top: 0; left: 0;
  overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
  scrollbar-width: thin; z-index: 40;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
#sidebar::-webkit-scrollbar { width: 6px; }
#sidebar::-webkit-scrollbar-thumb { background: var(--color-border-1); border-radius: 3px; }
.sidebar-logo {
  display: flex; align-items: center; gap: var(--s-3);
  padding: 18px var(--s-4) 16px; text-align: left;
  border: none; background: none; width: 100%; flex-shrink: 0;
  border-bottom: 1px solid var(--color-border-0);
}
.sidebar-logo-icon {
  width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
  background: linear-gradient(140deg, var(--color-accent) 0%, var(--color-brand-2) 100%);
  display: grid; place-items: center; color: #fff;
  box-shadow: 0 2px 8px rgba(14, 124, 134, .28);
}
.sidebar-logo-text { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; min-width: 0; }
.sidebar-logo-top { font-size: var(--fs-12); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--color-ink-0); }
.sidebar-logo-bottom { font-size: var(--fs-10); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--color-ink-2); }
.sidebar-nav { display: flex; flex-direction: column; gap: 1px; padding: var(--s-3) var(--s-2); flex: 1; }
.sidebar-section-label {
  font-size: var(--fs-10); font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
  color: var(--color-ink-3); padding: var(--s-4) var(--s-3) var(--s-1); display: block;
}
.nav-item {
  display: flex; align-items: center; gap: var(--s-3);
  padding: 0 var(--s-3); border-radius: var(--r-md); min-height: 38px;
  font-size: var(--fs-13); font-weight: 500; color: var(--color-ink-1);
  background: none; border: none; width: 100%; text-align: left;
  transition: background var(--motion-fast) var(--ease-out), color var(--motion-fast) var(--ease-out);
  white-space: nowrap; position: relative;
}
.nav-item:hover { background: var(--color-surface-2); color: var(--color-ink-0); }
.nav-item[aria-current="page"] { background: var(--color-accent-soft); color: var(--color-accent-ink); font-weight: 600; }
.nav-item[aria-current="page"]::before {
  content: ''; position: absolute; left: -8px; top: 8px; bottom: 8px; width: 3px;
  background: var(--color-accent); border-radius: 0 3px 3px 0;
}
.nav-item svg { flex-shrink: 0; opacity: .75; }
.nav-item[aria-current="page"] svg { opacity: 1; }
.nav-item span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.nav-badge {
  min-width: 19px; height: 19px; padding: 0 5px; border-radius: var(--r-pill);
  font-size: var(--fs-10); font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
  background: var(--color-surface-3); color: var(--color-ink-1);
}
.nav-badge--alert { background: var(--color-alert); color: #fff; }
.nav-badge--warn { background: var(--color-warn); color: #241300; }
.sidebar-sep { height: 1px; background: var(--color-border-0); margin: var(--s-3) var(--s-2); }
.sidebar-foot { padding: var(--s-3) var(--s-4) var(--s-4); flex-shrink: 0; border-top: 1px solid var(--color-border-0); }
.sidebar-foot-title { font-size: var(--fs-11); font-weight: 600; color: var(--color-ink-1); }
.sidebar-foot-sub { font-size: var(--fs-10); color: var(--color-ink-2); line-height: 1.5; margin-top: 2px; }

#sidebar-backdrop { display: none; }
.btn.topbar-menu-toggle { display: none; }
@media (max-width: 1023px) {
  #sidebar {
    position: fixed !important; top: 0; left: 0; height: 100vh; height: 100dvh; width: min(280px, 86vw);
    transform: translateX(-100%); transition: transform var(--motion-slow) var(--ease-out);
    z-index: 100; box-shadow: var(--shadow-modal);
  }
  #sidebar[data-open="true"] { transform: translateX(0); }
  #sidebar-backdrop { display: block; position: fixed; inset: 0; background: rgba(6,14,20,.5); z-index: 99; opacity: 0; pointer-events: none; transition: opacity var(--motion-med); }
  #sidebar-backdrop[data-open="true"] { opacity: 1; pointer-events: auto; }
  .btn.topbar-menu-toggle { display: inline-flex; }
}

/* ═══════════════════════════════════════════════════════════
   TOPBAR + CONTENT
   ═══════════════════════════════════════════════════════════ */
#app-shell { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
#topbar {
  background: var(--color-surface-0);
  border-bottom: 1px solid var(--color-border-0);
  min-height: var(--topbar-h); flex-shrink: 0;
  display: flex; align-items: center; gap: var(--s-3);
  padding: 0 var(--page-px); position: sticky; top: 0; z-index: 30;
  padding-left: max(var(--page-px), env(safe-area-inset-left, 0px));
  padding-right: max(var(--page-px), env(safe-area-inset-right, 0px));
}
.topbar-title {
  font-size: var(--fs-15); font-weight: 600; color: var(--color-ink-0);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  min-width: 0; flex: 0 1 auto;
}
.topbar-spacer { flex: 1; }
.topbar-actions { display: flex; align-items: center; gap: var(--s-2); flex-shrink: 0; }
.topbar-search {
  display: flex; align-items: center; gap: var(--s-2);
  height: 34px; padding: 0 var(--s-3); min-width: 220px; max-width: 360px; flex: 1;
  border: 1px solid var(--color-border-1); border-radius: var(--r-md);
  background: var(--color-surface-2); color: var(--color-ink-2); font-size: var(--fs-12);
  transition: border-color var(--motion-fast), background var(--motion-fast);
}
.topbar-search:hover { border-color: var(--color-border-2); background: var(--color-surface-0); }
.topbar-search span { flex: 1; text-align: left; }
.topbar-kbd {
  display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 19px; padding: 0 5px;
  background: var(--color-surface-0); border: 1px solid var(--color-border-1);
  border-radius: 4px; font-family: var(--ff-mono); font-size: var(--fs-10); color: var(--color-ink-2);
}
@media (max-width: 720px) { .topbar-search span, .topbar-kbd { display: none; } .topbar-search { min-width: 0; width: 36px; flex: 0 0 36px; justify-content: center; padding: 0; } }

#content {
  flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: contain;
  padding: var(--s-6) var(--page-px) var(--s-16);
  padding-left: max(var(--page-px), env(safe-area-inset-left, 0px));
  padding-right: max(var(--page-px), env(safe-area-inset-right, 0px));
  padding-bottom: calc(var(--s-16) + env(safe-area-inset-bottom, 0px));
}
.content-inner { max-width: var(--content-max); width: 100%; margin: 0 auto; }
@media (max-width: 900px) { :root { --page-px: 20px; } }
@media (max-width: 640px) { :root { --page-px: 14px; } }
@keyframes pageIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.page-fade { animation: pageIn var(--motion-med) var(--ease-out) both; }

.page-hdr {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: var(--s-4); flex-wrap: wrap; margin-bottom: var(--s-5);
}
.page-hdr-left { min-width: 0; }
.page-label { font-size: var(--fs-10); text-transform: uppercase; letter-spacing: .1em; color: var(--color-ink-2); font-weight: 700; }
.page-title { font-size: var(--fs-24); font-weight: 600; margin-top: 2px; }
.page-sub { color: var(--color-ink-1); font-size: var(--fs-13); margin-top: 3px; max-width: 62ch; }
.page-hdr-right { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; }

/* ═══════════════════════════════════════════════════════════
   PRIMITIVES
   ═══════════════════════════════════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  padding: 0 var(--s-4); height: 36px; border-radius: var(--r-md);
  border: 1px solid var(--color-border-1); background: var(--color-surface-0);
  color: var(--color-ink-0); font-size: var(--fs-13); font-weight: 500;
  transition: background var(--motion-fast) var(--ease-out), border-color var(--motion-fast), box-shadow var(--motion-fast), transform 70ms ease;
  white-space: nowrap;
}
.btn:hover { background: var(--color-surface-2); border-color: var(--color-border-2); }
.btn:active { transform: scale(.975); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn--primary { background: var(--color-accent); border-color: var(--color-accent); color: #fff; box-shadow: 0 1px 2px rgba(14,124,134,.25); }
.btn--primary:hover { background: var(--color-accent-h); border-color: var(--color-accent-h); }
.btn--ghost { background: transparent; border-color: transparent; color: var(--color-ink-1); }
.btn--link { background: none; border: none; color: var(--color-accent-ink); height: auto; padding: 0; font-weight: 600; }
.btn--link:hover { background: none; text-decoration: underline; }
.btn--ghost:hover { background: var(--color-surface-2); color: var(--color-ink-0); }
.btn--danger { color: var(--color-alert); border-color: var(--color-border-1); background: var(--color-surface-0); }
.btn--danger:hover { background: var(--color-alert-bg); border-color: var(--color-alert); }
[data-theme="dark"] .btn--primary { color: #0B1016; box-shadow: none; }
[data-theme="dark"] .btn--primary:hover { color: #0B1016; }
.btn--sm { height: 29px; padding: 0 var(--s-3); font-size: var(--fs-12); }
.btn--icon { width: 36px; padding: 0; }
.btn--icon.btn--sm { width: 29px; }
.btn--lg { height: 42px; padding: 0 var(--s-5); font-size: var(--fs-15); }
.btn--block { width: 100%; }

.card {
  background: var(--color-surface-1);
  border: 1px solid var(--color-border-0);
  border-radius: var(--radius-card);
  padding: var(--s-5);
  box-shadow: var(--shadow-card);
}
.card--flat { box-shadow: none; }
.card--pad-sm { padding: var(--s-4); }
.card--hover { cursor: pointer; transition: border-color var(--motion-med) var(--ease-out), box-shadow var(--motion-med) var(--ease-out), transform var(--motion-med) var(--ease-out); }
.card--hover:hover { border-color: var(--color-border-2); box-shadow: var(--shadow-card-hover); transform: translateY(-2px); }
.card-hdr { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); margin-bottom: var(--s-4); }
.card-title { font-size: var(--fs-13); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--color-ink-1); }
.card-link { font-size: var(--fs-12); color: var(--color-accent-ink); background: none; border: none; padding: 0; font-weight: 600; }
.card-link:hover { text-decoration: underline; }

.input, .textarea, .select {
  width: 100%; padding: 0 var(--s-3); height: 36px; border-radius: var(--r-md);
  border: 1px solid var(--color-border-1); background: var(--color-surface-0);
  color: var(--color-ink-0); font-size: var(--fs-13);
  transition: border-color var(--motion-fast) var(--ease-out), box-shadow var(--motion-fast);
}
.textarea { min-height: 78px; padding: var(--s-2) var(--s-3); height: auto; resize: vertical; line-height: 1.5; }
.input:focus, .textarea:focus, .select:focus { border-color: var(--color-accent); box-shadow: 0 0 0 3px var(--color-accent-soft); }
.input:disabled { background: var(--color-surface-2); color: var(--color-ink-2); }
.label { display: block; font-size: var(--fs-12); font-weight: 600; color: var(--color-ink-1); margin-bottom: 5px; }
.field-hint { font-size: var(--fs-11); color: var(--color-ink-2); margin-top: 4px; line-height: 1.45; }
.field-error { font-size: var(--fs-11); color: var(--color-alert); margin-top: 4px; font-weight: 500; }
.input[aria-invalid="true"], .select[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--color-alert); }

.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 0 var(--s-3); height: 30px;
  border-radius: var(--r-pill); border: 1px solid var(--color-border-1);
  background: var(--color-surface-0); font-size: var(--fs-12); color: var(--color-ink-1); font-weight: 500;
  transition: background var(--motion-fast), border-color var(--motion-fast), color var(--motion-fast);
}
.chip:hover { border-color: var(--color-border-2); background: var(--color-surface-2); }
.chip[aria-pressed="true"], .chip--active { color: var(--color-accent-ink); border-color: var(--color-accent); background: var(--color-accent-soft); font-weight: 600; }
.chip-count { font-size: var(--fs-10); color: var(--color-ink-2); font-variant-numeric: tabular-nums; }

.pill-bar { display: flex; gap: var(--s-2); flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; padding: 3px; background: var(--color-surface-2); border: 1px solid var(--color-border-0); border-radius: var(--r-md); gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg-btn { border: none; background: none; padding: 0 var(--s-3); height: 28px; border-radius: 7px; font-size: var(--fs-12); font-weight: 500; color: var(--color-ink-1); white-space: nowrap; }
.seg-btn:hover { color: var(--color-ink-0); }
.seg-btn[aria-pressed="true"] { background: var(--color-surface-0); color: var(--color-ink-0); font-weight: 600; box-shadow: var(--shadow-soft); }

/* Status token — the core visual language of HomeCare */
.status {
  display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 8px;
  border-radius: var(--r-sm); font-size: var(--fs-11); font-weight: 600; white-space: nowrap;
  background: var(--color-muted-bg); color: var(--color-muted-ink);
}
.status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.status--alert { background: var(--color-alert-bg); color: var(--color-alert-ink); }
.status--warn  { background: var(--color-warn-bg);  color: var(--color-warn-ink); }
.status--ok    { background: var(--color-ok-bg);    color: var(--color-ok-ink); }
.status--info  { background: var(--color-info-bg);  color: var(--color-info-ink); }
.status--muted { background: var(--color-muted-bg); color: var(--color-muted-ink); }
.status--plain::before { display: none; }

.meta { font-size: var(--fs-11); color: var(--color-ink-2); display: inline-flex; align-items: center; gap: 5px; }
.meta-sep { color: var(--color-ink-3); }
.tabular { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--ff-mono); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.hidden { display: none !important; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ═══════════════════════════════════════════════════════════
   MODAL / TOAST / POPOVER
   ═══════════════════════════════════════════════════════════ */
#modal-root, #toast-root, #panel-root { position: fixed; z-index: 200; }
#toast-root { bottom: var(--s-5); right: var(--s-5); display: flex; flex-direction: column; gap: var(--s-2); z-index: 400; pointer-events: none; }
#toast-root > * { pointer-events: auto; }
@media (max-width: 560px) { #toast-root { left: var(--s-3); right: var(--s-3); bottom: var(--s-3); } }

.toast {
  background: var(--color-surface-0); border: 1px solid var(--color-border-1);
  border-left-width: 3px; border-radius: var(--r-md); padding: var(--s-3) var(--s-4);
  min-width: 250px; max-width: 380px; box-shadow: var(--shadow-popover);
  font-size: var(--fs-13); display: flex; align-items: center; gap: var(--s-3);
  animation: toastIn 220ms var(--ease-out) both;
}
.toast-msg { flex: 1; min-width: 0; }
.toast-action { border: none; background: none; color: var(--color-accent-ink); font-weight: 600; font-size: var(--fs-12); padding: 0; }
.toast-action:hover { text-decoration: underline; }
.toast--ok { border-left-color: var(--color-ok); }
.toast--alert { border-left-color: var(--color-alert); }
.toast--warn { border-left-color: var(--color-warn); }
.toast--info { border-left-color: var(--color-info); }
@keyframes toastIn { from { opacity: 0; transform: translateX(24px) scale(.97); } to { opacity: 1; transform: none; } }

.modal-backdrop { position: fixed; inset: 0; background: rgba(8,18,24,.46); backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 200; padding: var(--s-4); overflow-y: auto; animation: fadeIn var(--motion-med) var(--ease-out); }
[inert] { pointer-events: none; }
.modal {
  background: var(--color-surface-0); border-radius: var(--r-xl);
  box-shadow: var(--shadow-modal); max-width: 520px; width: 100%;
  max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px);
  display: flex; flex-direction: column;
  animation: modalIn var(--motion-med) var(--ease-out) both;
  border: 1px solid var(--color-border-1);
}
.modal--lg { max-width: 760px; }
.modal--xl { max-width: 980px; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes modalIn { from { opacity: 0; transform: scale(.97) translateY(6px); } to { opacity: 1; transform: none; } }
.modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s-3); padding: var(--s-5) var(--s-5) var(--s-3); flex-shrink: 0; }
.modal-title { font-size: var(--fs-17); font-weight: 600; }
.modal-subtitle { font-size: var(--fs-12); color: var(--color-ink-2); margin-top: 2px; }
.modal-body { padding: 0 var(--s-5) var(--s-2); overflow-y: auto; flex: 1; }
.modal-footer {
  display: flex; justify-content: flex-end; gap: var(--s-2);
  padding: var(--s-4) var(--s-5); border-top: 1px solid var(--color-border-0);
  margin-top: var(--s-4); flex-shrink: 0; flex-wrap: wrap;
  padding-bottom: calc(var(--s-4) + env(safe-area-inset-bottom, 0px));
  background: var(--color-surface-0); position: sticky; bottom: 0;
  border-radius: 0 0 var(--r-xl) var(--r-xl);
}
.modal-footer--split { justify-content: space-between; }

.menu-item { display: flex; align-items: center; gap: var(--s-3); width: 100%; padding: var(--s-2) var(--s-3); border: none; background: none; border-radius: var(--r-sm); font-size: var(--fs-13); text-align: left; min-height: 38px; color: var(--color-ink-0); }
.menu-item:hover { background: var(--color-surface-2); }
.menu-item svg { color: var(--color-accent-ink); flex-shrink: 0; }
.popover {
  position: fixed; z-index: 500; background: var(--color-surface-0);
  border: 1px solid var(--color-border-1); border-radius: var(--r-lg);
  box-shadow: var(--shadow-popover); min-width: 240px; max-width: 380px; padding: var(--s-2);
  animation: popIn 140ms var(--ease-out) both;
}
@keyframes popIn { from { opacity: 0; transform: scale(.98) translateY(-4px); } to { opacity: 1; transform: none; } }
.picker-search { padding: var(--s-1) var(--s-1) var(--s-2); }
.picker-row { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-2) var(--s-3); border-radius: var(--r-sm); cursor: pointer; font-size: var(--fs-13); min-height: 36px; border: none; background: none; width: 100%; text-align: left; }
.picker-row:hover, .picker-row[data-active="true"] { background: var(--color-surface-2); }
.picker-row--selected { color: var(--color-accent-ink); background: var(--color-accent-soft); font-weight: 600; }
.picker-empty { padding: var(--s-4); color: var(--color-ink-2); text-align: center; font-size: var(--fs-12); }
.picker-sub { color: var(--color-ink-2); font-size: var(--fs-11); }

/* Slide-over detail panel */
.panel-backdrop { position: fixed; inset: 0; background: rgba(8,18,24,.4); z-index: 150; animation: fadeIn var(--motion-med) var(--ease-out); }
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%);
  max-height: 100dvh;
  background: var(--color-surface-0); border-left: 1px solid var(--color-border-1);
  z-index: 151; display: flex; flex-direction: column;
  box-shadow: var(--shadow-modal); animation: panelIn var(--motion-slow) var(--ease-out) both;
}
@keyframes panelIn { from { transform: translateX(100%); } to { transform: none; } }
.panel-header { padding: var(--s-5) var(--s-5) var(--s-3); border-bottom: 1px solid var(--color-border-0); display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s-3); flex-shrink: 0; }
.panel-body { padding: var(--s-5); overflow-y: auto; flex: 1; }
.panel-footer { padding: var(--s-4) var(--s-5); padding-bottom: calc(var(--s-4) + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--color-border-0); display: flex; gap: var(--s-2); flex-wrap: wrap; flex-shrink: 0; background: var(--color-surface-0); }

/* ═══════════════════════════════════════════════════════════
   EMPTY STATES / LISTS / TABLES
   ═══════════════════════════════════════════════════════════ */
.empty {
  display: flex; flex-direction: column; align-items: center; gap: var(--s-3);
  padding: var(--s-10) var(--s-6); text-align: center;
  border: 1px dashed var(--color-border-1); border-radius: var(--radius-card);
  background: var(--color-surface-1);
}
.empty--inline { padding: var(--s-6) var(--s-4); border: none; background: none; }
.empty-icon { width: 44px; height: 44px; border-radius: var(--r-lg); display: grid; place-items: center; background: var(--color-surface-2); color: var(--color-ink-2); }
.empty-title { font-size: var(--fs-15); font-weight: 600; color: var(--color-ink-0); }
.empty-sub { font-size: var(--fs-13); color: var(--color-ink-1); max-width: 42ch; line-height: 1.6; }

.row-list { display: flex; flex-direction: column; }
.row {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-3) var(--s-3); border-radius: var(--r-md);
  border: 1px solid transparent; background: none; width: 100%; text-align: left;
  transition: background var(--motion-fast), border-color var(--motion-fast);
}
.row + .row { border-top: 1px solid var(--color-border-0); border-radius: 0; }
.row-list .row:first-child { border-radius: var(--r-md) var(--r-md) 0 0; }
.row-list .row:last-child { border-radius: 0 0 var(--r-md) var(--r-md); }
.row:hover { background: var(--color-surface-2); }
.row-main { flex: 1; min-width: 0; background: none; border: none; padding: 0; text-align: left; font: inherit; color: inherit; }
.row-main:focus-visible { outline-offset: 4px; }
.row-title { font-size: var(--fs-13); font-weight: 600; color: var(--color-ink-0); }
.row-sub { font-size: var(--fs-11); color: var(--color-ink-2); margin-top: 2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.row-right { display: flex; align-items: center; gap: var(--s-2); flex-shrink: 0; }
.row-accent { width: 3px; align-self: stretch; border-radius: 2px; flex-shrink: 0; background: var(--color-border-1); }

/* Narrow screens: let rows breathe instead of crushing the title column */
@media (max-width: 620px) {
  .row { flex-wrap: wrap; row-gap: 10px; position: relative; padding-left: 14px; }
  .row-accent { position: absolute; left: 3px; top: 10px; bottom: 10px; width: 3px; align-self: auto; }
  .row-main { flex: 1 1 100%; }
  .row-right { flex: 1 1 100%; justify-content: flex-start; flex-wrap: wrap; }
  .prio { flex-wrap: wrap; row-gap: 8px; }
  .prio-main { flex: 1 1 auto; min-width: 130px; }
  .prio-right { flex: 1 1 100%; justify-content: flex-start; padding-left: 42px; }
  .card-hdr { flex-wrap: wrap; }
  .hero-actions { width: 100%; }
  .hero-actions .btn { flex: 1 1 100%; }
  .page-hdr-right { width: 100%; }
  .page-hdr-right .btn { flex: 1 1 auto; }
}
@media (max-width: 480px) {
  .kv { grid-template-columns: 1fr; gap: 2px var(--s-3); }
  .kv dd { margin-bottom: var(--s-2); }
  .agenda-date { display: flex; gap: 8px; align-items: baseline; }
}
.grid { display: grid; gap: var(--s-4); }
.grid-auto { grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); }
.grid-auto-lg { grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

.kv { display: grid; grid-template-columns: minmax(120px, 40%) 1fr; gap: var(--s-2) var(--s-4); font-size: var(--fs-13); }
.kv dt { color: var(--color-ink-2); font-size: var(--fs-12); }
.kv dd { margin: 0; color: var(--color-ink-0); overflow-wrap: anywhere; }

.bar-track { height: 7px; border-radius: 4px; background: var(--color-surface-3); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; background: var(--color-accent); transition: width var(--motion-slow) var(--ease-out); }

/* ═══════════════════════════════════════════════════════════
   DASHBOARD
   ═══════════════════════════════════════════════════════════ */
.hero {
  border-radius: var(--radius-card); padding: var(--s-6);
  border: 1px solid var(--color-border-0); background: var(--color-surface-1);
  box-shadow: var(--shadow-card); margin-bottom: var(--s-4);
  display: flex; gap: var(--s-6); align-items: center; justify-content: space-between; flex-wrap: wrap;
  position: relative; overflow: hidden;
}
.hero::before {
  content: ''; position: absolute; inset: 0 auto 0 0; width: 4px;
  background: var(--hero-accent, var(--color-accent));
}
.hero-left { min-width: 0; flex: 1 1 380px; }
.hero-eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-11); font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--hero-accent, var(--color-accent)); }
.hero-headline { font-size: var(--fs-30); font-weight: 600; line-height: 1.15; margin-top: var(--s-2); letter-spacing: -.02em; }
@media (max-width: 640px) { .hero-headline { font-size: var(--fs-24); } }
.hero-sub { color: var(--color-ink-1); font-size: var(--fs-13); margin-top: var(--s-2); max-width: 56ch; }
.hero-actions { display: flex; gap: var(--s-2); flex-wrap: wrap; align-items: center; }

.kpi-strip { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: var(--s-3); margin-bottom: var(--s-4); }
.kpi-strip--4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
@media (max-width: 1200px) { .kpi-strip { grid-template-columns: repeat(3, minmax(0,1fr)); } }
@media (max-width: 620px) { .kpi-strip { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.kpi {
  background: var(--color-surface-1); border: 1px solid var(--color-border-0);
  border-radius: var(--r-lg); padding: var(--s-4); text-align: left;
  box-shadow: var(--shadow-soft); display: flex; flex-direction: column; gap: 2px;
  transition: border-color var(--motion-med), box-shadow var(--motion-med), transform var(--motion-med);
}
.kpi:hover { border-color: var(--color-border-2); box-shadow: var(--shadow-card); transform: translateY(-2px); }
.kpi-value { font-size: var(--fs-24); font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
.kpi-label { font-size: var(--fs-11); color: var(--color-ink-2); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.kpi-foot { font-size: var(--fs-11); color: var(--color-ink-2); }
.kpi--alert .kpi-value { color: var(--color-alert); }
.kpi--warn .kpi-value { color: var(--color-warn); }
.kpi--ok .kpi-value { color: var(--color-ok); }

.prio-list { display: flex; flex-direction: column; gap: var(--s-2); }
.prio {
  display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) var(--s-4);
  border: 1px solid var(--color-border-0); border-radius: var(--r-md);
  background: var(--color-surface-1); width: 100%; text-align: left;
  transition: border-color var(--motion-fast), background var(--motion-fast), transform var(--motion-fast);
  border-left: 3px solid var(--prio-color, var(--color-border-1));
}
.prio:hover { border-color: var(--color-border-2); border-left-color: var(--prio-color, var(--color-border-1)); background: var(--color-surface-2); transform: translateX(2px); }
.prio-icon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex-shrink: 0; background: var(--prio-bg, var(--color-surface-2)); color: var(--prio-color, var(--color-ink-1)); }
.prio-main { flex: 1; min-width: 0; }
.prio-title { font-size: var(--fs-13); font-weight: 600; }
.prio-sub { font-size: var(--fs-11); color: var(--color-ink-2); margin-top: 1px; }
.prio-right { flex-shrink: 0; display: flex; align-items: center; gap: var(--s-2); }

.dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: var(--s-4); }
.quick-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: var(--s-2); }
.quick-btn {
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
  padding: var(--s-3) var(--s-4); border: 1px solid var(--color-border-1); border-radius: var(--r-md);
  background: var(--color-surface-0); text-align: left; min-height: 66px; justify-content: center;
  transition: border-color var(--motion-fast), background var(--motion-fast), transform var(--motion-fast);
}
.quick-btn:hover { border-color: var(--color-accent); background: var(--color-accent-soft); transform: translateY(-2px); }
.quick-btn span { font-size: var(--fs-12); font-weight: 600; }
.quick-btn svg { color: var(--color-accent-ink); }

/* ═══════════════════════════════════════════════════════════
   CHARTS (pure CSS/SVG, no libraries)
   ═══════════════════════════════════════════════════════════ */
.chart-bars { display: flex; align-items: flex-end; gap: 6px; height: 132px; padding-top: var(--s-3); }
.chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; height: 100%; justify-content: flex-end; }
.chart-bar { width: 100%; max-width: 34px; border-radius: 4px 4px 2px 2px; background: var(--color-accent); min-height: 3px; transition: height var(--motion-slow) var(--ease-out); position: relative; }
.chart-bar--muted { background: var(--color-surface-3); }
.chart-x { font-size: var(--fs-10); color: var(--color-ink-2); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: var(--s-3); font-size: var(--fs-11); color: var(--color-ink-1); }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend-swatch { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
.cat-row { display: grid; grid-template-columns: minmax(90px, 34%) 1fr auto; gap: var(--s-3); align-items: center; font-size: var(--fs-12); }
.cat-row + .cat-row { margin-top: var(--s-3); }

/* ═══════════════════════════════════════════════════════════
   CALENDAR
   ═══════════════════════════════════════════════════════════ */
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 1px; background: var(--color-border-0); border: 1px solid var(--color-border-0); border-radius: var(--r-lg); overflow: hidden; }
.cal-head { background: var(--color-surface-2); padding: var(--s-2); text-align: center; font-size: var(--fs-11); font-weight: 700; color: var(--color-ink-2); text-transform: uppercase; letter-spacing: .06em; }
.cal-day { background: var(--color-surface-1); min-height: 108px; padding: 6px; display: flex; flex-direction: column; gap: 3px; }
.cal-day--out { background: var(--color-surface-2); }
.cal-day--today { background: var(--color-accent-soft); }
.cal-daynum { font-size: var(--fs-11); font-weight: 700; color: var(--color-ink-2); display: flex; align-items: center; justify-content: space-between; }
.cal-day--today .cal-daynum { color: var(--color-accent); }
.cal-ev {
  display: flex; align-items: center; gap: 4px; font-size: var(--fs-11); padding: 2px 5px;

    try { const s = localStorage.getItem(LS_LANG); if (supported.includes(s)) return s; } catch {}

    return supported.includes(nav) ? nav : 'en';

    let v = dict[current][key] ?? dict.en[key];
    if (v == null) { if (typeof console !== 'undefined') console.warn('[i18n] missing key', key); return key; }
    if (params) for (const [k, pv] of Object.entries(params)) v = v.split('{' + k + '}').join(String(pv));

  };
  const plural = (n, keyOne, keyMany) => t(n === 1 ? keyOne : keyMany, { n });

    if (!supported.includes(lang) || lang === current) return;
    current = lang;
    try { localStorage.setItem(LS_LANG, lang); } catch {}
    document.documentElement.lang = lang;
    subs.forEach(cb => { try { cb(lang); } catch (e) { console.error(e); } });
  };

const Store = (() => {

  });

  const BAD_KEY = k => k === '__proto__' || k === 'constructor' || k === 'prototype';
  const deepClean = v => {
    if (v === null) return null;
    if (Array.isArray(v)) return v.map(deepClean);
    const ty = typeof v;
    if (ty === 'string' || ty === 'boolean') return v;
    if (ty === 'number') return Number.isFinite(v) ? v : null;
    if (ty !== 'object') return null;                       // functions, symbols, undefined
    const out = {};
    for (const k of Object.keys(v)) { if (!BAD_KEY(k)) out[k] = deepClean(v[k]); }

   * Returns { ok, code, detail, version, count }.
