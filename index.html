// DASHBOARD
// One primary action, one secondary, everything else behind "Add".
// Order: urgency first, numbers second, context third.
// ───────────────────────────────────────────────────────────────
const addMenuItems = () => [
  { icon: 'wrench', label: t('dash.action.addMaint'), onClick: () => Act.maintenanceForm() },
  { icon: 'alert-triangle', label: t('dash.action.reportRepair'), onClick: () => Act.repairForm() },
  { icon: 'package', label: t('dash.action.addAppliance'), onClick: () => Act.applianceForm() },
  { icon: 'layers', label: t('dash.action.startProject'), onClick: () => Act.projectForm() },
  { icon: 'receipt', label: t('dash.action.logCost'), onClick: () => Act.costForm() },
  { icon: 'phone', label: t('dash.action.addContact'), onClick: () => Act.contactForm() },
  { icon: 'book-open', label: t('m.library'), onClick: () => Act.openLibrary(renderApp) },
  { icon: 'home', label: t('dash.action.setupHome'), onClick: () => Act.homeProfileForm() }
];

const addMenuButton = (opts = {}) => {
  const btn = U.h('button.btn' + (opts.primary ? '.btn--primary' : ''), {
    type: 'button', 'aria-haspopup': 'menu', 'aria-expanded': 'false', 'aria-label': t('c.addNewAria')
  });
  btn.appendChild(U.icon('plus', 15));
  btn.appendChild(U.h('span', null, t('dash.addMenu')));
  btn.appendChild(U.icon('chevron-down', 13));
  btn.addEventListener('click', () => C.menu(btn, addMenuItems()));
  return btn;
};

Views.dashboard = root => {
  const st = S();
  const leadDays = parseInt(st.settings.warrantyLeadDays, 10) || 60;
  const prios = Sel.priorities();
  const overdue = Sel.maintOverdue();
  const dueSoon = Sel.maintToday().concat(Sel.maintWithin(1, 7));
  const urgentRepairs = Sel.repairsUrgent();
  const openRepairs = Sel.repairsOpen();
  const servicesOverdue = Sel.applianceServiceOverdue();
  const warranties = Sel.warrantiesExpiring();
  const homeSet = !!(st.home.name || st.home.address || st.home.propertyType || st.home.constructionYear);
  const emptyHome = Sel.isEmptyHome() && !homeSet;

  // ── Hero: the headline always matches the data behind it ──
  let eyebrow, headline, sub, accent, icon, primary, secondary;
  if (emptyHome) {
    eyebrow = t('dash.eyebrow.attention'); headline = t('dash.hero.empty'); sub = t('dash.hero.sub.empty');
    accent = 'var(--color-accent)'; icon = 'home';
    primary = { label: t('dash.cta.setupMy'), icon: 'home', onClick: () => Act.homeProfileForm() };
    secondary = { label: t('m.library'), icon: 'book-open', onClick: () => Act.openLibrary(renderApp) };
  } else if (urgentRepairs.length) {
    eyebrow = t('dash.eyebrow.urgent');
    headline = urgentRepairs.length === 1 ? t('dash.hero.urgentRepair1') : t('dash.hero.urgentRepair', { n: urgentRepairs.length });
    sub = t('dash.hero.sub.work'); accent = 'var(--color-alert)'; icon = 'alert-circle';
    primary = { label: t('dash.cta.reviewRepairs'), icon: 'alert-triangle', onClick: () => goto('repairs') };
    secondary = { label: t('dash.action.reportRepair'), icon: 'plus', onClick: () => Act.repairForm() };
  } else if (overdue.length) {
    eyebrow = t('dash.eyebrow.urgent');
    headline = overdue.length === 1 ? t('dash.hero.overdue1') : t('dash.hero.overdue', { n: overdue.length });
    sub = t('dash.hero.sub.work'); accent = 'var(--color-alert)'; icon = 'alert-circle';
    primary = { label: t('dash.cta.showOverdue'), icon: 'wrench', onClick: () => goto('maintenance', 'priority') };
    secondary = { label: t('dash.action.addMaint'), icon: 'plus', onClick: () => Act.maintenanceForm() };
  } else if (servicesOverdue.length) {
    eyebrow = t('dash.eyebrow.urgent');
    headline = servicesOverdue.length === 1 ? t('dash.hero.serviceOverdue1') : t('dash.hero.servicesOverdue', { n: servicesOverdue.length });
    sub = t('dash.hero.sub.work'); accent = 'var(--color-alert)'; icon = 'package';
    primary = { label: t('dash.cta.services'), icon: 'package', onClick: () => goto('appliances') };
    secondary = { label: t('dash.action.addAppliance'), icon: 'plus', onClick: () => Act.applianceForm() };
  } else if (dueSoon.length) {
    eyebrow = t('dash.eyebrow.attention');
    headline = dueSoon.length === 1 ? t('dash.hero.attention1') : t('dash.hero.attention', { n: dueSoon.length });
    sub = t('dash.hero.sub.work'); accent = 'var(--color-warn)'; icon = 'clock';
    primary = { label: t('dash.cta.showDue'), icon: 'wrench', onClick: () => goto('maintenance', 'priority') };
    secondary = { label: t('dash.action.addMaint'), icon: 'plus', onClick: () => Act.maintenanceForm() };
  } else if (warranties.length) {
    eyebrow = t('dash.eyebrow.attention');
    headline = warranties.length === 1
      ? t('dash.hero.warranty', { n: warranties[0].days })
      : t('dash.hero.warrantyN', { n: warranties.length, days: leadDays });
    sub = t('dash.hero.sub.work'); accent = 'var(--color-warn)'; icon = 'shield';
    primary = { label: t('dash.cta.warranty'), icon: 'shield', onClick: () => goto('records', 'warranty') };
    secondary = { label: t('dash.action.addAppliance'), icon: 'plus', onClick: () => Act.applianceForm() };
  } else {
    eyebrow = t('dash.eyebrow.calm'); headline = t('dash.hero.upToDate'); sub = t('dash.hero.sub.calm');
    accent = 'var(--color-ok)'; icon = 'check-circle';
    primary = { label: t('dash.action.addMaint'), icon: 'plus', onClick: () => Act.maintenanceForm() };
    secondary = { label: t('dash.action.reportRepair'), icon: 'alert-triangle', onClick: () => Act.repairForm() };
  }

  const hero = U.h('section.hero');
  hero.style.setProperty('--hero-accent', accent);
  hero.appendChild(U.h('div.hero-left', {}, [
    U.h('div.hero-eyebrow', {}, [U.icon(icon, 13), U.h('span', null, eyebrow)]),
    U.h('h1.hero-headline', null, headline),
    U.h('p.hero-sub', null, sub)
  ]));
  hero.appendChild(U.h('div.hero-actions', {}, [
    C.btn(primary.label, { primary: true, icon: primary.icon, onClick: primary.onClick }),
    C.btn(secondary.label, { icon: secondary.icon, onClick: secondary.onClick }),
    addMenuButton()
  ]));
  root.appendChild(hero);

  // ── Priority stack ──
  const prioBody = U.h('div.prio-list');
  if (!prios.length) {
    prioBody.appendChild(C.empty({
      icon: 'check-circle', inline: true,
      title: emptyHome ? t('dash.hero.empty') : t('dash.prio.empty'),
      sub: emptyHome ? t('dash.hero.sub.empty') : t('dash.prio.emptySub'),
      cta: emptyHome ? { label: t('m.library'), icon: 'book-open', onClick: () => Act.openLibrary(renderApp) } : null
    }));
  } else {
    prios.slice(0, 8).forEach(p => {
      const el = U.h('button.prio', { type: 'button', onClick: () => openRecord(p.kind, p.id) });
      el.style.setProperty('--prio-color', toneVar(p.tone));
      el.style.setProperty('--prio-bg', toneBg(p.tone));
      el.appendChild(U.h('span.prio-icon', {}, U.icon(p.icon, 15)));
      el.appendChild(U.h('div.prio-main', {}, [U.h('div.prio-title', null, p.title), U.h('div.prio-sub', null, p.sub)]));
      el.appendChild(U.h('div.prio-right', {}, [C.statusChip(p.badge, p.tone), U.icon('chevron-right', 15)]));
      prioBody.appendChild(el);
    });
    if (prios.length > 8) prioBody.appendChild(C.btn(t('c.showMore') + ' (' + prios.length + ')', { ghost: true, block: true, onClick: () => goto('maintenance', 'priority') }));
  }
  root.appendChild(C.card({
    title: t('dash.prio.title'),
    action: U.h('span.meta', null, t('dash.prio.sub')),
    children: prioBody,
    style: { marginBottom: 'var(--s-4)' }
  }));

  // ── Numbers band ──
  const costsYear = U.sum(Sel.costsThisYear(), c => c.amount);
  root.appendChild(U.h('div.kpi-strip', {}, [
    C.kpi({ value: String(overdue.length), label: t('dash.kpi.overdue'), tone: overdue.length ? 'alert' : null, onClick: () => goto('maintenance', 'priority') }),
    C.kpi({ value: String(Sel.maintDueThisMonth().length), label: t('dash.kpi.dueMonth'), tone: 'warn', onClick: () => goto('maintenance', 'list') }),
    C.kpi({ value: String(openRepairs.length), label: t('dash.kpi.openRepairs'), tone: urgentRepairs.length ? 'alert' : null, onClick: () => goto('repairs') }),
    C.kpi({ value: String(Sel.projectsActive().length), label: t('dash.kpi.activeProjects'), onClick: () => goto('projects') }),
    C.kpi({ value: String(Sel.appliancesTracked().length), label: t('dash.kpi.appliances'), onClick: () => goto('appliances') }),
    C.kpi({ value: money(costsYear), label: t('dash.kpi.costsYear'), onClick: () => goto('costs') })
  ]));

  // ── The two working lists ──
  const main = U.h('div.dash-grid');
  const next = U.sortBy(Sel.maintActive().filter(m => U.isDate(m.nextDue)), m => m.nextDue).slice(0, 5);
  main.appendChild(C.card({
    title: t('dash.next'),
    action: C.cardLink(t('c.showMore'), () => goto('maintenance', 'list')),
    children: next.length ? U.h('div.row-list', {}, next.map(m => maintRow(m, { compact: true })))
      : C.empty({ icon: 'wrench', inline: true, title: t('m.empty.title'), sub: t('m.empty.sub'), cta: { label: t('m.empty.cta'), onClick: () => Act.maintenanceForm() }, secondary: { label: t('m.library'), icon: 'book-open', onClick: () => Act.openLibrary(renderApp) } })
  }));
  main.appendChild(C.card({
    title: t('dash.openRepairs'),
    action: C.cardLink(t('c.showMore'), () => goto('repairs')),
    children: openRepairs.length ? U.h('div.row-list', {}, U.sortBy(openRepairs, r => ENUM.severity.indexOf(r.severity)).reverse().slice(0, 5).map(r => repairRow(r)))
      : C.empty({ icon: 'check-circle', inline: true, title: t('r.empty.title'), sub: t('r.empty.sub'), cta: { label: t('r.empty.cta'), onClick: () => Act.repairForm() } })
  }));
  root.appendChild(main);

  // ── Secondary context ──
  const grid = U.h('div.dash-grid', { style: { marginTop: 'var(--s-4)' } });

  const projs = Sel.projectsActive().slice(0, 4);
  grid.appendChild(C.card({
    title: t('dash.projects'),
    action: C.cardLink(t('c.showMore'), () => goto('projects')),
    children: projs.length ? U.h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--s-3)' } }, projs.map(p => {
      const pct = Sel.projectProgress(p);
      return U.h('button.row', { type: 'button', onClick: () => Views.projectDetail(p), style: { cursor: 'pointer' } }, [
        C.ring(pct, 42),
        U.h('div.row-main', {}, [
          U.h('div.row-title', null, p.title),
          U.h('div.row-sub', {}, C.metaBits([L.projStatus(p.status), p.targetDate ? fdateShort(p.targetDate) : null, p.budget ? money(Sel.projectSpent(p)) + ' / ' + money(p.budget) : null]))
        ])
      ]);
    })) : C.empty({ icon: 'layers', inline: true, title: t('p.empty.title'), sub: t('p.empty.sub'), cta: { label: t('p.empty.cta'), onClick: () => Act.projectForm() } })
  }));

  const hist = Sel.maintHistory().slice(0, 5);
  grid.appendChild(C.card({
    title: t('dash.history'),
    action: C.cardLink(t('c.showMore'), () => goto('maintenance', 'history')),
    children: hist.length ? U.h('div.row-list', {}, hist.map(h => C.row({
      tone: 'ok', title: h.taskTitle,
      sub: C.metaBits([fdate(h.date), h.cost ? money(h.cost) : null, h.note || null]),
      onClick: () => openRecord('maintenance', h.taskId)
    }))) : C.empty({ icon: 'check-circle', inline: true, title: t('m.empty.history.title'), sub: t('m.empty.history.sub') })
  }));

  grid.appendChild(C.card({
    title: t('dash.warranty'),
    action: C.cardLink(t('c.showMore'), () => goto('records', 'warranty')),
    children: warranties.length ? U.h('div.row-list', {}, warranties.slice(0, 5).map(w => C.row({
      tone: w.days <= Math.round(leadDays / 4) ? 'warn' : 'muted', title: w.appliance.name,
      sub: C.metaBits([t('dash.warrantyEndsIn', { n: w.days }), fdate(w.appliance.warrantyEnd)]),
      onClick: () => Views.applianceDetail(w.appliance)
    }))) : C.empty({ icon: 'shield', inline: true, title: t('hr.warranty.empty'), sub: t('hr.warranty.emptySub'), cta: { label: t('a.add'), icon: 'package', onClick: () => Act.applianceForm() } })
  }));

  const yearCosts = Sel.costsThisYear();
  const byType = ENUM.costType.map(ty => ({ label: L.costType(ty), value: U.sum(yearCosts.filter(c => c.type === ty), c => c.amount), color: COST_COLOR(ty) })).filter(x => x.value > 0).sort((a, b) => b.value - a.value);
  grid.appendChild(C.card({
    title: t('dash.costsCat'),
    action: C.cardLink(t('c.showMore'), () => goto('costs')),
    children: byType.length ? U.h('div', {}, [C.catBars(byType, money)])
      : C.empty({ icon: 'receipt', inline: true, title: t('k.empty.title'), sub: t('k.empty.sub'), cta: { label: t('k.empty.cta'), onClick: () => Act.costForm() } })
  }));

  root.appendChild(grid);
  root.appendChild(U.h('div', { style: { marginTop: 'var(--s-4)' } }, C.notice(t('app.safety'))));
};

const maintRow = (m, { compact } = {}) => {
  const status = Sel.maintStatus(m);
  const tone = TONE[status];
  const bits = [L.maintCat(m.category)];
  if (!compact) {
    if (m.roomId && Sel.roomName(m.roomId)) bits.push(Sel.roomName(m.roomId));
    if (m.applianceId && Sel.applianceName(m.applianceId)) bits.push(Sel.applianceName(m.applianceId));
    bits.push(L.frequency(m.frequency));
  }
  if (U.isDate(m.nextDue) && !m.closedAt) bits.push(fdate(m.nextDue));
  const right = [];
  if (!m.closedAt) right.push(C.iconBtn('check', t('m.complete'), () => Act.completeMaintenance(m, renderApp)));
  if (!compact) {
    right.push(C.iconBtn('edit', t('c.edit'), () => Act.maintenanceForm(m)));
    right.push(C.iconBtn(m.paused ? 'play' : 'pause', m.paused ? t('m.resume') : t('m.pause'), () => { Act.toggleMaintenancePause(m); }));
    right.push(C.iconBtn('trash', t('c.delete'), () => Act.deleteRecord('maintenance', m.id, m.title)));
  }
  return C.row({
    tone, title: m.title, demo: m.demo,
    sub: C.metaBits(bits),
    badge: C.statusChip(L.maintStatus(status), tone),
    right, onClick: () => Views.maintenanceDetail(m)
  });
};

const repairRow = (r, { full } = {}) => {
  const overdueTarget = U.isDate(r.targetDate) && U.diffDays(U.today(), r.targetDate) < 0 && !['completed', 'cancelled'].includes(r.status);
  const tone = r.status === 'completed' ? 'ok' : r.status === 'cancelled' ? 'muted' : TONE[r.severity] || 'info';
  const bits = [L.severity(r.severity), L.repairStatus(r.status)];
  if (r.roomId && Sel.roomName(r.roomId)) bits.push(Sel.roomName(r.roomId));
  if (r.applianceId && Sel.applianceName(r.applianceId)) bits.push(Sel.applianceName(r.applianceId));
  bits.push(t('r.reportedOn', { date: fdateShort(r.reportedDate) }));
  if (overdueTarget) bits.push(t('r.overdueTarget'));
  const right = [];
  if (!['completed', 'cancelled'].includes(r.status)) right.push(C.iconBtn('check', t('r.complete'), () => Act.completeRepair(r, renderApp)));
  if (full) {
    right.push(C.iconBtn('edit', t('c.edit'), () => Act.repairForm(r)));
    right.push(C.iconBtn('trash', t('c.delete'), () => Act.deleteRecord('repairs', r.id, r.title)));
  }
  return C.row({
    tone, title: r.title, demo: r.demo,
    sub: C.metaBits(bits.concat([r.nextAction ? '→ ' + r.nextAction : t('r.noNextAction')])),
    badge: C.statusChip(Sel.repairBadge(r), Sel.repairBadgeTone(r)),
    right, onClick: () => Views.repairDetail(r)
  });
};

const maintFilter = { status: 'all', category: 'all', room: 'all' };

Views.maintenance = root => {
  const sub = Router.get().sub || 'priority';
  root.appendChild(C.pageHeader({
    label: t('app.line'), title: t('m.title'), sub: t('m.sub'),
    actions: [
      C.btn(t('m.library'), { icon: 'book-open', onClick: () => Act.openLibrary(renderApp) }),
      C.btn(t('m.add'), { primary: true, icon: 'plus', onClick: () => Act.maintenanceForm() })
    ]
  }));

  root.appendChild(U.h('div', { style: { display: 'flex', gap: 'var(--s-3)', flexWrap: 'wrap', alignItems: 'center', marginBottom: 'var(--s-4)' } }, [
    C.segmented([
      { id: 'priority', label: t('m.view.priority') },
      { id: 'list', label: t('m.view.list') },
      { id: 'calendar', label: t('m.view.calendar') },
      { id: 'history', label: t('m.view.history') }
    ], sub, id => goto('maintenance', id))
  ]));

  const all = S().maintenance;
  if (!all.length) {
    root.appendChild(C.empty({
      icon: 'wrench', title: t('m.empty.title'), sub: t('m.empty.sub'),
      cta: { label: t('m.empty.cta'), onClick: () => Act.maintenanceForm() },
      secondary: { label: t('m.empty.libCta'), icon: 'book-open', onClick: () => Act.openLibrary(renderApp) }
    }));
    return;
  }

  if (sub === 'history') return maintHistoryView(root);
  if (sub === 'calendar') return maintCalendarView(root);

  // Filters (list + priority)
  const filterWrap = U.h('div', { style: { display: 'flex', gap: 'var(--s-3)', flexWrap: 'wrap', marginBottom: 'var(--s-4)', alignItems: 'flex-end' } });
  const mkSelect = (label, value, options, onChange) => {
    const id = 'flt-' + U.uid();
    const sel = U.h('select.select', { id, style: { width: 'auto', minWidth: '150px' }, onChange: e => onChange(e.target.value) },
      [U.h('option', { value: 'all' }, t('c.all') + ' — ' + label), ...options.map(o => U.h('option', { value: String(o.value) }, o.label))]);
    sel.value = value;
    return U.h('div', {}, [U.h('label.label', { htmlFor: id }, label), sel]);
  };
  filterWrap.appendChild(mkSelect(t('c.status'), maintFilter.status, opts(ENUM.maintStatus, L.maintStatus), v => { maintFilter.status = v; renderApp(); }));
  filterWrap.appendChild(mkSelect(t('c.category'), maintFilter.category, opts(ENUM.maintCat, L.maintCat), v => { maintFilter.category = v; renderApp(); }));
  if (S().rooms.length) filterWrap.appendChild(mkSelect(t('c.roomShort'), maintFilter.room, roomOptions(), v => { maintFilter.room = v; renderApp(); }));
  if (maintFilter.status !== 'all' || maintFilter.category !== 'all' || maintFilter.room !== 'all')
    filterWrap.appendChild(C.btn(t('c.clear'), { ghost: true, icon: 'x', onClick: () => { maintFilter.status = maintFilter.category = maintFilter.room = 'all'; renderApp(); } }));
  root.appendChild(filterWrap);

  const filtered = all.filter(m => {
    if (maintFilter.category !== 'all' && m.category !== maintFilter.category) return false;
    if (maintFilter.room !== 'all' && m.roomId !== maintFilter.room) return false;
    if (maintFilter.status !== 'all' && Sel.maintStatus(m) !== maintFilter.status) return false;
    return true;
  });

  if (!filtered.length) { root.appendChild(C.empty({ icon: 'filter', title: t('c.noResults'), sub: t('m.sub') })); return; }

  if (sub === 'list') {
    const sorted = U.sortBy(filtered, m => (m.closedAt ? '9' : '0') + (m.nextDue || '9999-99-99'));
    root.appendChild(C.card({ title: t('c.entries', { n: sorted.length }), children: U.h('div.row-list', {}, sorted.map(m => maintRow(m))) }));
    return;
  }

  // Priority view — grouped by urgency
  const groups = [
    { key: 'overdue', label: t('m.group.overdue'), items: filtered.filter(m => Sel.maintStatus(m) === 'overdue') },
    { key: 'today', label: t('m.group.today'), items: filtered.filter(m => Sel.maintStatus(m) === 'dueToday') },
    { key: 'week', label: t('m.group.week'), items: filtered.filter(m => { const s = Sel.maintStatus(m); return s === 'dueSoon'; }) },
    { key: 'month', label: t('m.group.month'), items: filtered.filter(m => Sel.maintStatus(m) === 'upcoming' && U.isDate(m.nextDue) && U.diffDays(U.today(), m.nextDue) <= 30 && !m.paused && !m.closedAt) },
    { key: 'later', label: t('m.group.later'), items: filtered.filter(m => Sel.maintStatus(m) === 'upcoming' && (!U.isDate(m.nextDue) || U.diffDays(U.today(), m.nextDue) > 30) && !m.paused && !m.closedAt) },
    { key: 'paused', label: t('m.group.paused'), items: filtered.filter(m => m.paused && !m.closedAt) },
    { key: 'closed', label: t('m.group.closed'), items: filtered.filter(m => !!m.closedAt) }
  ].filter(g => g.items.length);

  groups.forEach(g => root.appendChild(C.listGroup(g.label, g.items.length,
    C.card({ children: U.h('div.row-list', {}, U.sortBy(g.items, m => m.nextDue || '9999').map(m => maintRow(m))), className: 'card--pad-sm' }))));
};

const maintHistoryView = root => {
  const hist = Sel.maintHistory();
  if (!hist.length) { root.appendChild(C.empty({ icon: 'check-circle', title: t('m.empty.history.title'), sub: t('m.empty.history.sub') })); return; }
  const total = U.sum(hist, h => h.cost);
  root.appendChild(U.h('div.kpi-strip', { style: { gridTemplateColumns: 'repeat(auto-fit,minmax(160px,1fr))' } }, [
    C.kpi({ value: String(hist.length), label: t('m.view.history'), tone: 'ok' }),
    C.kpi({ value: money(total), label: t('c.cost') })
  ]));
  const byMonth = U.groupBy(hist, h => U.mstr(h.date));
  Object.keys(byMonth).sort().reverse().forEach(ym => {
    root.appendChild(C.listGroup(U.fmtMonth(ym, lang()), byMonth[ym].length,
      C.card({ className: 'card--pad-sm', children: U.h('div.row-list', {}, byMonth[ym].map(h => C.row({
        tone: 'ok', title: h.taskTitle,
        sub: C.metaBits([fdate(h.date), L.maintCat(h.category), h.cost ? money(h.cost) : null, h.note || null]),
        onClick: () => openRecord('maintenance', h.taskId)
      }))) })));
  });
};

const maintCalendarView = root => {
  const entries = Sel.maintActive().filter(m => U.isDate(m.nextDue)).map(m => ({
    date: m.nextDue, type: 'maintenance', id: m.id, title: m.title, tone: TONE[Sel.maintStatus(m)] || 'info'
  }));
  root.appendChild(monthGrid(calState.month, entries));
};

Views.maintenanceDetail = m => {
  const status = Sel.maintStatus(m);
  const body = U.h('div');
  body.appendChild(U.h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap', marginBottom: 'var(--s-4)' } }, [
    C.statusChip(L.maintStatus(status), TONE[status]),
    C.statusChip(L.maintCat(m.category), 'muted', true),
    C.statusChip(L.frequency(m.frequency), 'muted', true),
    m.priority && m.priority !== 'normal' ? C.statusChip(L.priority(m.priority), TONE[m.priority]) : null,
    m.demo ? C.demoBadge() : null
  ]));
  if (m.description) body.appendChild(U.h('p', { style: { color: 'var(--color-ink-1)', marginTop: '0' } }, m.description));
  body.appendChild(C.kvList([
    [t('m.field.nextDue'), m.closedAt ? t('st.completed') : (U.isDate(m.nextDue) ? fdate(m.nextDue) : t('c.na'))],
    [t('m.field.lastDone'), m.lastCompleted ? fdate(m.lastCompleted) : t('m.historyEmpty')],
    m.frequency === 'custom' ? [t('m.field.interval'), String(m.intervalDays || '—')] : null,
    [t('c.roomShort'), Sel.roomName(m.roomId) || t('c.na')],
    [t('c.appliance'), Sel.applianceName(m.applianceId) || t('c.na')],
    [t('c.estCost'), m.estimatedCost ? money(m.estimatedCost) : t('c.na')],
    [t('m.field.assignee'), m.assignee || t('c.na')],
    [t('c.provider'), Sel.contactName(m.contactId) || t('c.na')],
    m.notes ? [t('c.notes'), m.notes] : null
  ]));

  // Links
  const links = U.h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap', marginTop: 'var(--s-4)' } });
  if (m.applianceId) links.appendChild(linkChip('package', Sel.applianceName(m.applianceId), () => { Panel.close(); openRecord('appliance', m.applianceId); }));
  if (m.contactId) links.appendChild(linkChip('phone', Sel.contactName(m.contactId), () => { Panel.close(); openRecord('contact', m.contactId); }));
  if (links.childNodes.length) body.appendChild(links);

  body.appendChild(C.sectionTitle(t('m.history')));
  const hist = U.sortBy(m.history || [], h => h.date).reverse();
  const refresh = () => { Panel.close(); const fresh = Store.byId('maintenance', m.id); if (fresh) Views.maintenanceDetail(fresh); };
  if (!hist.length) body.appendChild(U.h('p', { style: { color: 'var(--color-ink-2)', fontSize: 'var(--fs-12)' } }, t('m.historyEmpty')));
  else body.appendChild(U.h('div.row-list', {}, hist.map(h => C.row({
    tone: 'ok', title: fdate(h.date),
    sub: C.metaBits([h.cost ? money(h.cost) : null, h.note || null]),
    right: [
      C.iconBtn('edit', t('m.hist.edit'), () => { Panel.close(); Act.completeMaintenance(m, renderApp, h); }),
      C.iconBtn('trash', t('c.delete'), () => { Panel.close(); Act.deleteMaintenanceHistory(m, h, renderApp); })
    ]
  }))));

  Panel.open({
    title: m.title,
    subtitle: L.maintCat(m.category) + ' · ' + t('m.historyCount', { n: hist.length }),
    body,
    actions: [
      !m.closedAt ? { label: t('m.complete'), primary: true, onClick: () => { Panel.close(); Act.completeMaintenance(m, renderApp); return false; } } : null,
      { label: t('c.edit'), onClick: () => { Panel.close(); Act.maintenanceForm(m); return false; } },
      !m.closedAt ? { label: m.paused ? t('m.resume') : t('m.pause'), onClick: () => { Act.toggleMaintenancePause(m); } } : null,
      { label: t('c.delete'), danger: true, onClick: () => { Panel.close(); Act.deleteRecord('maintenance', m.id, m.title); return false; } }
    ].filter(Boolean)
  });
};

        U.h('div', { style: { display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' } }, [

        ]),

      ]),
      C.statusChip(L.applStatus(derived), tone)

    const facts = U.h('div', { style: { marginTop: 'var(--s-3)', display: 'flex', flexDirection: 'column', gap: '6px' } });
    facts.appendChild(U.h('div.meta', {}, [U.icon('shield', 13), U.h('span', null,

        : warrantyDays < 0 ? t('a.warrantyExpired', { date: fdateShort(a.warrantyEnd) })
        : warrantyDays <= (S().settings.warrantyLeadDays || 60) ? t('a.warrantySoon', { n: warrantyDays })
        : t('a.warrantyActive', { date: fdate(a.warrantyEnd) }))]));
    if (nextSvc) facts.appendChild(U.h('div.meta', {}, [U.icon('wrench', 13), U.h('span', {

Views.projectDetail = source => {

  const pct = Sel.projectProgress(p);

  if (mode === 'manual') {
    const sliderId = 'pp-' + U.uid();
    const slider = U.h('input', { type: 'range', min: '0', max: '100', step: '5', id: sliderId, style: { width: '100%', accentColor: 'var(--color-accent)' } });

    const out = U.h('output', { htmlFor: sliderId, style: { fontWeight: '700', minWidth: '46px', textAlign: 'right' } }, pct + '%');
    slider.addEventListener('input', () => { out.textContent = slider.value + '%'; });
    slider.addEventListener('change', () => {
      Store.upsert('projects', { id: p.id, progress: Number(slider.value), progressMode: 'manual' });
      refresh();
    });
    progressBox.appendChild(U.h('div', { style: { display: 'flex', alignItems: 'center', gap: 'var(--s-3)', marginTop: 'var(--s-3)' } }, [
      U.h('label.label', { htmlFor: sliderId, style: { margin: '0', whiteSpace: 'nowrap' } }, t('p.progressSet')), slider, out
    ]));

    [t('c.roomShort'), Sel.roomName(p.roomId) || t('c.na')],
    [t('p.field.start'), p.startDate ? fdate(p.startDate) : t('c.na')],
    [t('p.field.target'), p.targetDate ? fdate(p.targetDate) : t('c.na')],
    [t('p.field.budget'), budget ? money(budget) : t('c.na')],
    [t('c.actualCost'), money(spent)],
    [t('p.budgetVariance'), budget ? (budget - spent < 0 ? t('p.overBudget', { amount: money(spent - budget) }) : t('p.underBudget', { amount: money(budget - spent) })) : t('c.na')],
    [t('p.nextAction'), p.nextAction || t('c.na')],
    p.notes ? [t('c.notes'), p.notes] : null
  ]));

  // ── Service providers ──
  body.appendChild(C.sectionTitle(t('p.providers')));
  const provWrap = U.h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap', alignItems: 'center' } });
  const linkedContacts = (p.contactIds || []).map(id => Store.byId('contacts', id)).filter(Boolean);
  if (!linkedContacts.length) provWrap.appendChild(U.h('span.meta', null, t('p.noProviders')));
  linkedContacts.forEach(c => {
    const chip = U.h('span.chip', {}, [
      U.icon('phone', 12),
      U.h('button.btn--link', { type: 'button', style: { font: 'inherit' }, onClick: () => { Panel.close(); openRecord('contact', c.id); } }, c.company),
      U.h('button.chip-remove', { type: 'button', 'aria-label': t('c.remove') + ': ' + c.company, onClick: () => Act.unlinkProjectContact(p, c.id, refresh) }, U.icon('x', 12))
    ]);
    provWrap.appendChild(chip);
  });
  const addProvBtn = C.btn(t('p.addProvider'), { sm: true, icon: 'plus' });
  addProvBtn.addEventListener('click', () => Act.linkProjectContact(p, addProvBtn, refresh));
  provWrap.appendChild(addProvBtn);
  body.appendChild(provWrap);

  // ── Tasks ──
  body.appendChild(C.sectionTitle(t('p.tasks')));
  const taskList = U.h('div.row-list');
  if (!tasks.length) taskList.appendChild(U.h('p', { style: { color: 'var(--color-ink-2)', fontSize: 'var(--fs-12)' } }, t('p.noTasks')));
  tasks.forEach(task => {
    const cbId = 'pt-' + task.id;
    const cb = U.h('input', { type: 'checkbox', id: cbId, style: { width: '18px', height: '18px', accentColor: 'var(--color-accent)' } });
    cb.checked = !!task.done;
    cb.addEventListener('change', () => {
      const fresh = Store.byId('projects', p.id);
      const next = (fresh.tasks || []).map(x => x.id === task.id ? { ...x, done: cb.checked } : x);
      Store.upsert('projects', { id: p.id, tasks: next, progressMode: 'auto', progress: Math.round(next.filter(x => x.done).length / next.length * 100) });
      refresh();
    });
    taskList.appendChild(U.h('div.row', {}, [
      cb,
      U.h('label.row-main', { htmlFor: cbId, style: { textDecoration: task.done ? 'line-through' : 'none', opacity: task.done ? '.6' : '1', cursor: 'pointer' } },
        U.h('span.row-title', null, task.title)),
      U.h('div.row-right', {}, C.iconBtn('trash', t('c.delete'), () => {
        const fresh = Store.byId('projects', p.id);
        const next = (fresh.tasks || []).filter(x => x.id !== task.id);
        Store.upsert('projects', { id: p.id, tasks: next, progressMode: next.length ? 'auto' : 'manual' });
        refresh();
      }))
    ]));
  });
  body.appendChild(taskList);
  const taskId = 'pt-new-' + U.uid();
  const taskInput = U.h('input.input', { type: 'text', id: taskId, placeholder: t('p.taskPh') });
  const addTask = () => {
    const v = taskInput.value.trim(); if (!v) return;
    const fresh = Store.byId('projects', p.id);
    const next = (fresh.tasks || []).concat([{ id: U.uid('pt'), title: v, done: false }]);
    Store.upsert('projects', { id: p.id, tasks: next, progressMode: 'auto', progress: Math.round(next.filter(x => x.done).length / next.length * 100) });
    refresh();
  };
  taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addTask(); } });
  body.appendChild(U.h('div', { style: { marginTop: 'var(--s-2)' } }, [
    U.h('label.sr-only', { htmlFor: taskId }, t('p.taskAdd')),
    U.h('div', { style: { display: 'flex', gap: 'var(--s-2)' } }, [taskInput, C.btn(t('c.add'), { icon: 'plus', onClick: addTask })])
  ]));

  // ── Materials ──
  body.appendChild(C.sectionTitle(t('p.materials')));
  const mats = p.materials || [];
  const matList = U.h('div.row-list');
  if (!mats.length) matList.appendChild(U.h('p', { style: { color: 'var(--color-ink-2)', fontSize: 'var(--fs-12)' } }, t('p.noMaterials')));
  mats.forEach(mt => matList.appendChild(U.h('div.row', {}, [
    U.h('div.row-main', {}, U.h('div.row-title', null, mt.title)),
    U.h('div.row-right', {}, C.iconBtn('trash', t('c.delete'), () => {
      const fresh = Store.byId('projects', p.id);
      Store.upsert('projects', { id: p.id, materials: (fresh.materials || []).filter(x => x.id !== mt.id) });
      refresh();
    }))
  ])));
  body.appendChild(matList);
  const matId = 'pm-new-' + U.uid();
  const matInput = U.h('input.input', { type: 'text', id: matId, placeholder: t('p.materialPh') });
  const addMat = () => {
    const v = matInput.value.trim(); if (!v) return;
    const fresh = Store.byId('projects', p.id);
    Store.upsert('projects', { id: p.id, materials: (fresh.materials || []).concat([{ id: U.uid('pm'), title: v }]) });
    refresh();
  };
  matInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addMat(); } });
  body.appendChild(U.h('div', { style: { marginTop: 'var(--s-2)' } }, [
    U.h('label.sr-only', { htmlFor: matId }, t('p.materialAdd')),
    U.h('div', { style: { display: 'flex', gap: 'var(--s-2)' } }, [matInput, C.btn(t('c.add'), { icon: 'plus', onClick: addMat })])
  ]));

  // ── Costs ──
  body.appendChild(C.sectionTitle(t('nav.costs')));
  const pc = S().costs.filter(c => c.projectId === p.id);
  body.appendChild(pc.length ? U.h('div.row-list', {}, pc.map(c => C.row({
    title: c.title, sub: C.metaBits([fdate(c.date), L.costType(c.type)]),
    right: [U.h('strong.tabular', null, money(c.amount))],
    onClick: () => { Panel.close(); Act.costForm(c); }
  }))) : U.h('p', { style: { color: 'var(--color-ink-2)', fontSize: 'var(--fs-12)' } }, t('k.empty.title')));
  body.appendChild(U.h('div', { style: { marginTop: 'var(--s-2)' } },
    C.btn(t('k.add'), { sm: true, icon: 'plus', onClick: () => { Panel.close(); Act.costForm(null, { projectId: p.id, type: 'project', roomId: p.roomId, title: p.title }); } })));

  Panel.open({
    title: p.title, subtitle: L.projStatus(p.status), body,
    actions: [
      { label: t('c.edit'), primary: true, onClick: () => { Panel.close(); Act.projectForm(p); return false; } },
      { label: t('c.delete'), danger: true, onClick: () => { Panel.close(); Act.deleteRecord('projects', p.id, p.title, renderApp); return false; } }
    ]
  });

const monthGrid = (ym, entries) => {
  const wrap = U.h('div');
  const first = U.parse(ym + '-01');
  const weekStart = S().settings.weekStart === 'sun' ? 0 : 1;
  const firstDow = (first.getDay() - weekStart + 7) % 7;
  const daysInMonth = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const byDate = U.groupBy(entries, e => e.date);

  const nav = U.h('div', { style: { display: 'flex', alignItems: 'center', gap: 'var(--s-2)', marginBottom: 'var(--s-3)', flexWrap: 'wrap' } }, [
    C.iconBtn('chevron-left', t('cal.prevMonth'), () => { calState.month = U.mstr(U.addMonths(ym + '-01', -1)); renderApp(); }),
    U.h('strong', { style: { minWidth: '160px', textAlign: 'center', fontSize: 'var(--fs-15)' } }, U.fmtMonth(ym, lang())),
    C.iconBtn('chevron-right', t('cal.nextMonth'), () => { calState.month = U.mstr(U.addMonths(ym + '-01', 1)); renderApp(); }),
    C.btn(t('cal.today'), { sm: true, onClick: () => { calState.month = U.mstr(U.today()); renderApp(); } })
  ]);
  wrap.appendChild(nav);

  const grid = U.h('div.cal-grid');
  U.weekdayNames(lang(), S().settings.weekStart).forEach(d => grid.appendChild(U.h('div.cal-head', null, d)));
  const prevMonthDays = new Date(first.getFullYear(), first.getMonth(), 0).getDate();
  for (let i = 0; i < firstDow; i++) grid.appendChild(U.h('div.cal-day.cal-day--out', {}, U.h('div.cal-daynum', null, String(prevMonthDays - firstDow + i + 1))));
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = ym + '-' + String(d).padStart(2, '0');
    const isToday = iso === U.today();
    const cell = U.h('div.cal-day' + (isToday ? '.cal-day--today' : ''));
    cell.appendChild(U.h('div.cal-daynum', {}, [U.h('span', null, String(d)), (byDate[iso] || []).length > 3 ? U.h('span', null, String(byDate[iso].length)) : null]));
    (byDate[iso] || []).slice(0, 3).forEach(e => {
      const btn = U.h('button.cal-ev', { type: 'button', title: t('cal.type.' + e.type) + ': ' + e.title, onClick: () => openRecord(e.type, e.id) }, e.title);
      btn.style.setProperty('--ev-color', CAL_TYPE_COLOR[e.type] || 'var(--color-ink-3)');
      cell.appendChild(btn);
    });
    if ((byDate[iso] || []).length > 3) cell.appendChild(U.h('button.cal-more', { type: 'button', onClick: () => dayModal(iso, byDate[iso]) }, t('cal.more', { n: byDate[iso].length - 3 })));
    grid.appendChild(cell);
  }
  const rest = (7 - ((firstDow + daysInMonth) % 7)) % 7;
  for (let i = 1; i <= rest; i++) grid.appendChild(U.h('div.cal-day.cal-day--out', {}, U.h('div.cal-daynum', null, String(i))));
  wrap.appendChild(U.h('div.cal-hint', {}, [U.icon('info', 12), U.h('span', null, t('cal.scrollHint'))]));
  wrap.appendChild(U.h('div.cal-scroll', {}, grid));

  wrap.appendChild(U.h('div.legend', { style: { marginTop: 'var(--s-3)' } }, Object.keys(CAL_TYPE_COLOR).map(k =>
    U.h('span.legend-item', {}, [U.h('span.legend-swatch', { style: { background: CAL_TYPE_COLOR[k] } }), U.h('span', null, t('cal.type.' + k))]))));
  return wrap;
};

const dayModal = (iso, entries) => Modal.open({
  title: fdate(iso),
  body: entries.length ? U.h('div.row-list', {}, entries.map(e => C.row({
    tone: e.tone, title: e.title, sub: t('cal.type.' + e.type), onClick: () => { Modal.close(); openRecord(e.type, e.id); }

const agendaList = (entries, emptyNode) => {

  const byDate = U.groupBy(entries, e => e.date);
  const wrap = U.h('div');
  Object.keys(byDate).sort().forEach(d => {

};

Views.costs = root => {
  root.appendChild(C.pageHeader({
    label: t('app.line'), title: t('k.title'), sub: t('k.sub'),
    actions: [C.btn(t('k.add'), { primary: true, icon: 'plus', onClick: () => Act.costForm() })]
  }));

  const all = S().costs;
  if (!all.length) {
    root.appendChild(C.empty({ icon: 'receipt', title: t('k.empty.title'), sub: t('k.empty.sub'), cta: { label: t('k.empty.cta'), onClick: () => Act.costForm() } }));
    return;
  }

  const monthCosts = Sel.costsThisMonth(), yearCosts = Sel.costsThisYear();
  const yearTotal = U.sum(yearCosts, c => c.amount);
  const monthsWithData = new Set(all.map(c => U.mstr(c.date)).filter(Boolean)).size || 1;
  root.appendChild(U.h('div.kpi-strip', { style: { gridTemplateColumns: 'repeat(auto-fit,minmax(170px,1fr))' } }, [
    C.kpi({ value: money(U.sum(monthCosts, c => c.amount)), label: t('k.kpi.month') }),
    C.kpi({ value: money(yearTotal), label: t('k.kpi.year') }),
    C.kpi({ value: money(Sel.costsPlanned()), label: t('k.kpi.planned'), foot: t('k.kpi.plannedHint'), tone: 'warn' }),
    C.kpi({ value: money(U.sum(all, c => c.amount) / monthsWithData), label: t('k.kpi.avgMonth') })
  ]));

  // 12-month bar chart
  const months = [];
  for (let i = 11; i >= 0; i--) months.push(U.mstr(U.addMonths(U.today(), -i)));
  const chartData = months.map(ym => ({
    label: new Intl.DateTimeFormat(U.LOCALE[lang()], { month: 'short' }).format(U.parse(ym + '-01')),
    value: U.sum(all.filter(c => U.mstr(c.date) === ym), c => c.amount)
  }));
  const grid = U.h('div.grid.grid-auto-lg', { style: { marginTop: 'var(--s-4)' } });
  grid.appendChild(C.card({ title: t('k.byMonth'), children: C.barChart(chartData, money), style: { gridColumn: '1 / -1' } }));

  // by type
  const byType = ENUM.costType.map(ty => ({ label: L.costType(ty), value: U.sum(yearCosts.filter(c => c.type === ty), c => c.amount), color: COST_COLOR(ty) })).filter(x => x.value > 0).sort((a, b) => b.value - a.value);
  grid.appendChild(C.card({ title: t('k.byCategory'), children: byType.length ? C.catBars(byType, money) : U.h('p.meta', null, t('c.noResults')) }));

  // by room
  const roomAgg = {};
  yearCosts.forEach(c => { const key = c.roomId || '__none'; roomAgg[key] = (roomAgg[key] || 0) + (Number(c.amount) || 0); });
  const byRoom = Object.entries(roomAgg).map(([k, v]) => ({ label: k === '__none' ? t('k.noRoom') : (Sel.roomName(k) || t('k.noRoom')), value: v, color: 'var(--color-accent)' })).sort((a, b) => b.value - a.value).slice(0, 8);
  grid.appendChild(C.card({ title: t('k.byRoom'), children: byRoom.length ? C.catBars(byRoom, money) : U.h('p.meta', null, t('c.noResults')) }));

  // top appliances
  const applAgg = S().appliances.map(a => ({ label: a.name, value: Sel.applianceCost(a.id), color: 'var(--color-info)', id: a.id })).filter(x => x.value > 0).sort((a, b) => b.value - a.value).slice(0, 6);
  grid.appendChild(C.card({ title: t('k.topAppliances'), children: applAgg.length ? C.catBars(applAgg, money) : U.h('p.meta', null, t('a.empty.title')) }));

  // project variance
  const projs = S().projects.filter(p => Number(p.budget) > 0);
  grid.appendChild(C.card({
    title: t('k.variance'),
    children: projs.length ? U.h('div.row-list', {}, projs.map(p => {
      const spent = Sel.projectSpent(p), diff = (Number(p.budget) || 0) - spent;
      return C.row({
        tone: diff < 0 ? 'alert' : 'ok', title: p.title,
        sub: C.metaBits([money(spent) + ' / ' + money(p.budget)]),
        right: [U.h('strong.tabular', { style: { color: diff < 0 ? 'var(--color-alert)' : 'var(--color-ok)' } }, (diff < 0 ? '+ ' : '− ') + money(Math.abs(diff)))],
        onClick: () => Views.projectDetail(p)
      });
    })) : U.h('p.meta', null, t('p.empty.title'))
  }));

  // recent expenses
  const recent = U.sortBy(all, c => c.date).reverse().slice(0, 12);
  grid.appendChild(C.card({
    title: t('k.recent'), style: { gridColumn: '1 / -1' },
    children: U.h('div.row-list', {}, recent.map(c => C.row({
      tone: 'muted', title: c.title, demo: c.demo,
      sub: C.metaBits([fdate(c.date), L.costType(c.type), Sel.roomName(c.roomId) || null, Sel.applianceName(c.applianceId) || null,
        c.sourceType !== 'manual' ? t('k.source.auto', { source: c.sourceType === 'maintenance' ? t('nav.maintenance') : t('nav.repairs') }) : null]),
      right: [U.h('strong.tabular', null, money(c.amount)),
        C.iconBtn('edit', t('c.edit'), () => Act.costForm(c)),
        C.iconBtn('trash', t('c.delete'), () => Act.deleteRecord('costs', c.id, c.title, renderApp))],
      onClick: () => Act.costForm(c)
    })))
  }));

  root.appendChild(grid);
};

// GLOBAL SEARCH
// ═══════════════════════════════════════════════════════════════
const Search = (() => {
  let shell = null, escHandler = null, opener = null;
  const close = () => {
    if (!shell) return;
    shell.remove(); shell = null;
    window.removeEventListener('keydown', escHandler); escHandler = null;
    A11y.popInert(); A11y.unlockScroll();
    A11y.restoreFocus(opener); opener = null;
  };

  const collect = q => {
    const needle = q.toLowerCase();
    const hit = (...vals) => vals.some(v => v && String(v).toLowerCase().includes(needle));
    const groups = [];
    const push = (label, items) => { if (items.length) groups.push({ label, items }); };
    push(t('nav.maintenance'), S().maintenance.filter(m => hit(m.title, m.description, m.notes, m.assignee, L.maintCat(m.category)))
      .map(m => ({ kind: 'maintenance', id: m.id, title: m.title, sub: L.maintCat(m.category) + ' · ' + (m.nextDue ? fdate(m.nextDue) : L.frequency(m.frequency)) })));
    push(t('nav.appliances'), S().appliances.filter(a => hit(a.name, a.manufacturer, a.model, a.serial, a.notes, a.docLocation))
      .map(a => ({ kind: 'appliance', id: a.id, title: a.name, sub: [a.manufacturer, a.model].filter(Boolean).join(' ') || L.applCat(a.category) })));
    push(t('nav.repairs'), S().repairs.filter(r => hit(r.title, r.description, r.nextAction, r.notes))
      .map(r => ({ kind: 'repair', id: r.id, title: r.title, sub: L.repairStatus(r.status) + ' · ' + L.severity(r.severity) })));
    push(t('nav.projects'), S().projects.filter(p => hit(p.title, p.description, p.notes, p.nextAction))
      .map(p => ({ kind: 'project', id: p.id, title: p.title, sub: L.projStatus(p.status) })));
    push(t('nav.contacts'), S().contacts.filter(c => hit(c.company, c.contactPerson, c.phone, c.email, c.notes, c.address))
      .map(c => ({ kind: 'contact', id: c.id, title: c.company, sub: L.contactCat(c.category || 'other') })));
    push(t('nav.costs'), S().costs.filter(k => hit(k.title, k.notes))
      .map(k => ({ kind: 'cost', id: k.id, title: k.title, sub: fdate(k.date) + ' · ' + money(k.amount) })));
    const recs = [];
    S().rooms.filter(r => hit(r.name, r.notes, r.floor)).forEach(r => recs.push({ kind: 'room', id: r.id, title: r.name, sub: t('hr.tab.rooms') }));
    S().utilities.filter(u => hit(u.provider, u.customerNo, u.meterNo, u.notes)).forEach(u => recs.push({ kind: 'records-utilities', id: u.id, title: u.provider, sub: L.utilityType(u.type) }));
    S().materials.filter(m => hit(m.name, m.brand, m.code, m.where)).forEach(m => recs.push({ kind: 'records-materials', id: m.id, title: m.name, sub: t('hr.tab.materials') }));
    S().docLocations.filter(d => hit(d.what, d.where, d.notes)).forEach(d => recs.push({ kind: 'records-docs', id: d.id, title: d.what, sub: d.where }));
    S().notes.filter(n => hit(n.title, n.body)).forEach(n => recs.push({ kind: 'records-notes', id: n.id, title: n.title, sub: t('hr.tab.notes') }));
    push(t('nav.records'), recs);
    return groups;
  };

  const open = () => {
    if (shell) return;
    opener = document.activeElement;
    const input = U.h('input.search-input', { type: 'text', id: 'global-search-input', placeholder: t('s.ph'), 'aria-label': t('s.title'), autocomplete: 'off', role: 'combobox', 'aria-expanded': 'true', 'aria-autocomplete': 'list' });
    const results = U.h('div.search-results');
    let flat = [], activeIdx = 0;

    const render = () => {
      U.clear(results);
      const q = input.value.trim();
      flat = [];
      if (!q) { results.appendChild(U.h('div.picker-empty', null, t('s.empty'))); return; }
      const groups = collect(q);
      if (!groups.length) { results.appendChild(U.h('div.picker-empty', null, t('s.noResults', { q }))); return; }
      groups.forEach(g => {
        results.appendChild(U.h('div.search-group-title', null, g.label));
        g.items.slice(0, 8).forEach(item => {
          const idx = flat.length;
          const row = U.h('button.picker-row', { type: 'button', dataset: { active: String(idx === activeIdx) }, onClick: () => choose(item) }, [
            U.h('span', { style: { flex: '1' } }, item.title),
            U.h('span.picker-sub', null, item.sub || '')
          ]);
          flat.push({ item, row });
          results.appendChild(row);
        });
      });
    };

    const choose = item => {
      close();
      if (item.kind.startsWith('records-')) goto('records', item.kind.split('-')[1]);
      else openRecord(item.kind, item.id);
    };

    input.addEventListener('input', () => { activeIdx = 0; render(); });
    input.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(flat.length - 1, activeIdx + 1); render(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(0, activeIdx - 1); render(); }
      else if (e.key === 'Enter') { e.preventDefault(); if (flat[activeIdx]) choose(flat[activeIdx].item); }
    });

    const box = U.h('div.search-box', { role: 'dialog', 'aria-modal': 'true', 'aria-label': t('s.title') }, [
      U.h('div.search-input-wrap', {}, [U.icon('search', 18), input, U.h('kbd.topbar-kbd', null, 'Esc')]),
      results
    ]);
    shell = U.h('div.search-shell', { onMousedown: e => { if (e.target === shell) close(); } }, box);
    document.body.appendChild(shell);
    A11y.pushInert(); A11y.lockScroll();
    render();
    setTimeout(() => input.focus(), 30);
    escHandler = e => {
      if (e.key === 'Escape') { e.preventDefault(); close(); }
      else A11y.trap(e, box);
    };
    window.addEventListener('keydown', escHandler);
  };

  return { open, close };
})();

// ═══════════════════════════════════════════════════════════════
// BACKUP — export with a real success check, strict validated import
// ═══════════════════════════════════════════════════════════════
const Backup = (() => {
  const filename = () => 'atlas-homecare-backup-' + U.today() + '.json';
  const payload = () => {
    const data = Store.snapshot();
    data.meta.exportedAt = U.nowIso();
    return JSON.stringify(data, null, 2);
  };

  /** Shows the JSON in a selectable box when the environment blocks downloads. */
  const manualFallback = (json, reason) => {
    const box = U.h('textarea.textarea', { readonly: 'readonly', rows: 10, style: { fontFamily: 'var(--ff-mono)', fontSize: '11px' } });
    box.value = json;
    const body = U.h('div', {}, [
      C.notice(reason, 'warn'),
      U.h('p.field-hint', { style: { margin: 'var(--s-3) 0 var(--s-2)' } }, t('set.backup.manualHint')),
      box
    ]);
    Modal.open({
      title: t('set.backup.manualTitle'), size: 'lg', body,
      actions: [
        { label: t('set.backup.copy'), onClick: async () => { box.focus(); box.select(); await copyToClipboard(json, true); return false; } },
        { label: t('c.close'), primary: true }
      ]
    });
    setTimeout(() => { box.focus(); box.select(); }, 60);
  };

  const copyToClipboard = async (text, silent) => {
    try {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); Toast.show(t('set.backup.copied'), 'ok'); return true; }
    } catch (e) { /* falls through to the manual path */ }
    try {
      const ta = U.h('textarea', { style: { position: 'fixed', top: '-1000px', opacity: '0' } });
      ta.value = text;
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand && document.execCommand('copy');
      ta.remove();
      if (ok) { Toast.show(t('set.backup.copied'), 'ok'); return true; }
    } catch (e) { /* no clipboard access at all */ }
    if (!silent) manualFallback(text, t('set.backup.copyFail'));
    return false;
  };

  const copyJson = () => copyToClipboard(payload(), false);

  const exportJson = () => {
    const json = payload();
    let started = false;
    try {
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = U.h('a', { href: url, download: filename(), rel: 'noopener' });
      document.body.appendChild(a);
      a.click();
      started = true;
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    } catch (e) {
      console.error('[backup] download blocked', e);
      started = false;
    }
    if (!started) { manualFallback(json, t('set.backup.downloadFail')); return false; }
    Store.patchSettings({ lastExportAt: U.nowIso() });
    Toast.show(t('set.exported'), 'ok');
    return true;
  };

  const importError = (message) => Modal.open({
    title: t('set.importError.title'),
    body: U.h('p', { style: { lineHeight: '1.6', margin: '0' } }, message),
    actions: [{ label: t('c.close'), primary: true }]
  });

  const describe = result => {
    switch (result.code) {
      case 'shape': return t('set.importError.parse');
      case 'app': return t('set.importError.schema', { fields: 'meta.app = "' + result.detail[0] + '"' });
      case 'version': return t('set.importError.version', { v: result.detail[0] });
      case 'missing': return t('set.importError.schema', { fields: result.detail.join(', ') });
      case 'records': return t('set.importError.records', { n: result.count, example: result.detail[0] });
      default: return t('set.importError.parse');
    }
  };

  const importJson = () => {
    const input = U.h('input', { type: 'file', accept: 'application/json,.json', style: { display: 'none' } });
    input.addEventListener('change', () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        let parsed;
        try { parsed = JSON.parse(String(reader.result)); }
        catch { importError(t('set.importError.parse')); return; }

        const result = Store.validate(parsed);
        if (!result.ok) { importError(describe(result)); return; }

        const n = COLLECTIONS.reduce((a, c) => a + (parsed[c] || []).length, 0);
        const from = result.version;
        const stamp = parsed.meta && parsed.meta.updatedAt ? fdate(String(parsed.meta.updatedAt).slice(0, 10)) : '—';
        const body = U.h('div', {}, [
          U.h('p', { style: { lineHeight: '1.6', marginTop: '0' } }, t('set.confirmImport.msg', { n, date: stamp })),
          from < SCHEMA_VERSION ? C.notice(t('set.migrated', { from, to: SCHEMA_VERSION }), 'info') : null
        ]);
        Modal.open({
          title: t('set.confirmImport.title'), body,
          actions: [
            { label: t('c.cancel') },
            { label: t('set.confirmImport.btn'), danger: true, onClick: () => {
              Store.markUndo('import');
              Store.replaceAll(parsed);            // normalise() migrates and re-applies language + theme
              Toast.undoable(t('set.imported', { n }), () => {
                if (Store.undo()) Toast.show(t('set.importUndone'), 'ok', 4200);
              });
              renderApp();
            } }
          ]
        });
      };
      reader.onerror = () => importError(t('set.importError.parse'));
      reader.readAsText(file);
    });
    document.body.appendChild(input); input.click(); setTimeout(() => input.remove(), 1000);
  };

  /** never | fresh | stale, plus a human-readable age. */
  const status = () => {
    const iso = S().settings.lastExportAt;
    if (!iso) return { state: 'never', days: null };
    const day = String(iso).slice(0, 10);
    if (!U.isDate(day)) return { state: 'never', days: null };
    const days = Math.max(0, U.diffDays(day, U.today()));
    return { state: days > 30 ? 'stale' : 'fresh', days, date: day };
  };

  const ageLabel = days => days === 0 ? t('c.todayWord') : days === 1 ? t('c.yesterday') : t('c.daysAgo', { n: days });

  return { exportJson, importJson, copyJson, status, ageLabel };
})();

// ═══════════════════════════════════════════════════════════════
// ONBOARDING — four steps on a draft. Nothing touches the store
// until "Open my Home Dashboard", so going back never duplicates.
// ═══════════════════════════════════════════════════════════════
const Onboarding = (() => {
  const start = () => {
    let step = 1;
    const draft = {
      home: { ...S().home },
      appliances: [],          // built here, written once at the end
      library: []              // [{ key, item, date }]
    };

    const finish = () => {
      let savedAppliances = 0;
      Store.markUndo('onboarding');
      Store.patchHome(draft.home);
      draft.appliances.forEach(qa => {
        const next = (qa.serviceIntervalMonths && U.isDate(qa.lastService)) ? U.addMonths(qa.lastService, qa.serviceIntervalMonths) : '';
        Store.upsert('appliances', {
          id: U.uid('a'), name: qa.name, category: qa.category, lifecycle: 'active',
          manufacturer: '', model: '', serial: '', roomId: '',
          purchaseDate: qa.purchaseDate || '', purchasePrice: null,
          warrantyEnd: qa.warrantyEnd || '', replacementYear: null,
          serviceIntervalMonths: qa.serviceIntervalMonths || null,
          lastService: qa.lastService || '', nextService: next,
          contactId: '', docLocation: '', notes: '', serviceHistory: []
        });
        savedAppliances++;
      });
      const savedTasks = Act.applyLibrarySelection(draft.library);
      Store.patchSettings({ onboarded: true });
      Modal.closeAll();
      Toast.show((savedAppliances || savedTasks)
        ? t('onb.saved', { a: savedAppliances, m: savedTasks })
        : t('onb.savedNone'), 'ok', 5000);
      goto('dashboard');
      renderApp();
    };

    const skip = () => {
      Store.patchSettings({ onboarded: true });
      Modal.closeAll();
      Toast.show(t('onb.skipHint'), 'info', 5000);
    };

    const render = () => {
      Modal.closeAll();
      const body = U.h('div');
      body.appendChild(U.h('div.onb-steps', { role: 'presentation' }, [1, 2, 3, 4].map(i => U.h('div.onb-dot' + (i <= step ? '.onb-dot--done' : '')))));
      body.appendChild(U.h('div', { style: { fontSize: 'var(--fs-11)', fontWeight: '700', letterSpacing: '.08em', textTransform: 'uppercase', color: 'var(--color-ink-2)', marginBottom: 'var(--s-2)' } }, t('onb.step', { n: step })));
      let actions = [];

      // ── 1 · Welcome ──
      if (step === 1) {
        body.appendChild(U.h('div.onb-illus', {}, Shell.brandMark(44)));
        body.appendChild(U.h('h3', { style: { fontSize: 'var(--fs-20)', marginBottom: 'var(--s-2)' } }, t('onb.1.title')));
        body.appendChild(U.h('p', { style: { color: 'var(--color-ink-1)' } }, t('onb.1.body')));
        body.appendChild(U.h('p', { style: { color: 'var(--color-accent-ink)', fontWeight: '600' } }, t('app.promise')));
        body.appendChild(C.notice(t('onb.draftHint'), 'info'));
        actions = [{ label: t('c.next'), primary: true, onClick: () => { step = 2; render(); return false; } }];

      // ── 2 · Home ──
      } else if (step === 2) {
        body.appendChild(U.h('h3', { style: { fontSize: 'var(--fs-20)', marginBottom: 'var(--s-2)' } }, t('onb.2.title')));
        body.appendChild(U.h('p', { style: { color: 'var(--color-ink-1)' } }, t('onb.2.body')));
        const { grid, refs } = Form.build([
          { name: 'name', label: t('hr.home.name'), type: 'text', value: draft.home.name || '', col2: true, placeholder: t('hr.home.namePh') },
          { name: 'propertyType', label: t('hr.home.type'), type: 'select', value: draft.home.propertyType || '', options: opts(ENUM.propertyType, L.propertyType) },
          { name: 'constructionYear', label: t('hr.home.year'), type: 'year', value: draft.home.constructionYear ?? '', min: 1000, max: 2200 },
          { name: 'heatingType', label: t('hr.home.heating'), type: 'select', value: draft.home.heatingType || '', options: opts(ENUM.heatingType, L.heatingType) },
          { name: 'livingArea', label: t('hr.home.area'), type: 'number', value: draft.home.livingArea ?? '', min: 0 },
          { name: 'address', label: t('hr.home.address'), type: 'text', value: draft.home.address || '', col2: true }
        ]);
        body.appendChild(grid);
        const capture = () => { draft.home = { ...draft.home, ...Form.read(refs) }; };
        actions = [
          { label: t('c.back'), onClick: () => { capture(); step = 1; render(); return false; } },
          { label: t('c.next'), primary: true, onClick: () => { capture(); step = 3; render(); return false; } }
        ];

      // ── 3 · Appliances (draft only) ──
      } else if (step === 3) {
        body.appendChild(U.h('h3', { style: { fontSize: 'var(--fs-20)', marginBottom: 'var(--s-2)' } }, t('onb.3.title')));
        body.appendChild(U.h('p', { style: { color: 'var(--color-ink-1)' } }, t('onb.3.body')));

        const listWrap = U.h('div');
        const formWrap = U.h('div');
        const redrawList = () => {
          U.clear(listWrap);
          if (!draft.appliances.length) {
            listWrap.appendChild(U.h('p.field-hint', null, t('onb.3.empty')));
            return;
          }
          listWrap.appendChild(C.sectionTitle(t('onb.3.listTitle')));
          listWrap.appendChild(U.h('div.row-list', {}, draft.appliances.map((qa, i) => C.row({
            tone: 'ok', title: qa.name,
            sub: C.metaBits([
              L.applCat(qa.category),
              qa.warrantyEnd ? t('a.field.warrantyEnd') + ': ' + fdateShort(qa.warrantyEnd) : null,
              qa.serviceIntervalMonths ? qa.serviceIntervalMonths + ' ' + t('a.field.serviceInterval') : null
            ]),
            right: [C.iconBtn('trash', t('c.remove') + ': ' + qa.name, () => { draft.appliances.splice(i, 1); redrawList(); })]
          }))));
        };

        const buildForm = () => {
          U.clear(formWrap);
          const { grid, refs } = Form.build([
            { name: 'name', label: t('onb.3.nameLabel'), type: 'text', value: '', placeholder: t('onb.applianceQuick') },
            { name: 'category', label: t('onb.3.catLabel'), type: 'select', value: 'other', options: opts(ENUM.applCat, L.applCat), allowEmpty: false },
            { type: 'disclosure', label: t('c.showDetails'), fields: [
              { name: 'purchaseDate', label: t('a.field.purchaseDate'), type: 'date', value: '' },
              { name: 'warrantyEnd', label: t('a.field.warrantyEnd'), type: 'date', value: '' },
              { name: 'serviceIntervalMonths', label: t('a.field.serviceInterval'), type: 'number', value: '', min: 1, max: 240 },
              { name: 'lastService', label: t('a.field.lastService'), type: 'date', value: '' }
            ] }
          ]);
          const add = () => {
            const data = Form.read(refs);
            if (!data.name) { refs.name.err.textContent = t('c.required'); refs.name.err.hidden = false; refs.name.input.focus(); return; }
            draft.appliances.push({
              name: data.name, category: data.category || 'other',
              purchaseDate: data.purchaseDate || '', warrantyEnd: data.warrantyEnd || '',
              serviceIntervalMonths: data.serviceIntervalMonths || null, lastService: data.lastService || ''
            });
            redrawList(); buildForm();
            const next = formWrap.querySelector('input');
            if (next) next.focus();
          };
          refs.name.input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
          formWrap.appendChild(grid);
          formWrap.appendChild(U.h('div', { style: { marginTop: 'var(--s-3)' } }, C.btn(t('c.add'), { icon: 'plus', onClick: add })));
        };

        redrawList(); buildForm();
        body.appendChild(listWrap);
        body.appendChild(U.h('hr'));
        body.appendChild(formWrap);
        actions = [
          { label: t('c.back'), onClick: () => { step = 2; render(); return false; } },
          { label: t('c.next'), primary: true, onClick: () => { step = 4; render(); return false; } }
        ];

      // ── 4 · Recommended maintenance, picked right here ──
      } else {
        body.appendChild(U.h('h3', { style: { fontSize: 'var(--fs-20)', marginBottom: 'var(--s-2)' } }, t('onb.4.title')));
        body.appendChild(U.h('p', { style: { color: 'var(--color-ink-1)' } }, t('onb.4.body')));
        const picker = Act.libraryPicker({ compact: true, openFirst: true, preselect: draft.library });
        body.appendChild(picker.node);
        const capture = () => { draft.library = picker.selection(); };
        actions = [
          { label: t('c.back'), onClick: () => { capture(); step = 3; render(); return false; } },
          { label: t('onb.finish'), primary: true, onClick: () => { capture(); finish(); return false; } }
        ];
      }

      Modal.open({
        title: t('app.name'), subtitle: t('app.subtitle'), size: 'lg', body, actions,
        footerLeft: C.btn(t('onb.skipAll'), { ghost: true, onClick: skip })
      });
    };

    render();
  };
  return { start };
})();

      U.h('div.set-row', {}, [
        U.h('div', {}, [U.h('div.set-row-label', null, t('set.demoRemove')), U.h('div.set-row-sub', null, t('set.demoRemoveHint'))]),
        C.btn(t('set.demoRemove'), { icon: 'trash', disabled: !Demo.hasDemo(), onClick: () => Modal.confirm({
          title: t('set.confirmDemoRemove.title'), message: t('set.confirmDemoRemove.msg'), confirmLabel: t('set.demoRemove'), danger: true, onConfirm: () => Demo.remove()
        }) })
      ]),
      U.h('div.set-row', {}, [
        U.h('div', {}, [U.h('div.set-row-label', { style: { color: 'var(--color-alert)' } }, t('set.reset')), U.h('div.set-row-sub', null, t('set.resetHint'))]),
        C.btn(t('set.reset'), { danger: true, icon: 'refresh', onClick: () => Modal.confirm({
          title: t('set.confirmReset.title'), message: t('set.confirmReset.msg'), confirmLabel: t('set.confirmReset.btn'), danger: true,
          onConfirm: () => { Store.wipe(); Toast.undoable(t('set.resetDone'), () => { if (Store.undo()) Toast.show(t('c.restored'), 'ok'); }); goto('dashboard'); }
        }) })
      ]),
      U.h('div.set-row-sub', { style: { marginTop: 'var(--s-3)' } }, t('set.storage', { n: Store.count() }))
    ]
  }));

  // ── About ──
  grid.appendChild(C.card({
    title: t('set.about'),
    children: [
      U.h('div', { style: { display: 'flex', gap: 'var(--s-3)', alignItems: 'center', marginBottom: 'var(--s-3)' } }, [
        U.h('span.sidebar-logo-icon', {}, Shell.brandMark(19)),
        U.h('div', {}, [
          U.h('div', { style: { fontWeight: '700' } }, 'ATLAS HOMECARE'),
          U.h('div.set-row-sub', null, t('app.subtitle'))
        ])
      ]),
      U.h('p', { style: { color: 'var(--color-ink-1)', margin: '0 0 var(--s-3)' } }, t('app.tagline')),
      C.notice(t('app.safety')),
      U.h('div', { style: { marginTop: 'var(--s-3)' } }, C.notice(t('app.privacy'), 'info')),
      U.h('div.set-row-sub', { style: { marginTop: 'var(--s-3)' } }, t('set.version', { v: APP_VERSION, s: SCHEMA_VERSION }) + ' · ' + t('app.line'))
    ]
  }));

  root.appendChild(grid);
};

// ═══════════════════════════════════════════════════════════════
// APP RENDER LOOP + BOOT
// ═══════════════════════════════════════════════════════════════
let renderScheduled = false;
function renderApp() {
  const route = Router.get();
  Shell.renderSidebar();
  Shell.renderTopbar();
  const root = document.getElementById('content-inner');
  U.clear(root);
  const page = U.h('div.page-fade');
  const view = Views[route.module] || Views.dashboard;
  try { view(page); }
  catch (e) {
    console.error('[render]', e);
    U.clear(page);
    page.appendChild(C.empty({ icon: 'alert-triangle', title: t('app.renderError'), sub: t('app.renderErrorSub') }));
  }
  root.appendChild(page);
  const content = document.getElementById('content');
  if (content) content.scrollTop = 0;
  document.title = t('nav.' + route.module) + ' · ' + t('app.name');
}
const scheduleRender = () => {
  if (renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(() => { renderScheduled = false; renderApp(); });
};

Store.subscribe(scheduleRender);
Router.sub(() => renderApp());
I18N.sub(() => renderApp());

window.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'k') { e.preventDefault(); Search.open(); }
});

// ── Boot ──
(function boot() {
  const loaded = Store.load();
  const savedLang = S().settings.language;
  if (savedLang && I18N.supported.includes(savedLang) && savedLang !== I18N.get()) I18N.set(savedLang);
  Shell.applyTheme();
  const backdrop = document.getElementById('sidebar-backdrop');
  if (backdrop) backdrop.addEventListener('click', Shell.closeMobile);
  if (!location.hash) location.hash = '#/dashboard';
  Router.handle();
  renderApp();
  if (loaded.migratedFrom) {
    setTimeout(() => Toast.show(t('set.migrated', { from: loaded.migratedFrom, to: SCHEMA_VERSION }), 'info', 6000), 600);
  }
  setTimeout(() => { if (!S().settings.onboarded) Onboarding.start(); }, 350);
})();

})(); // end of app IIFE
</script>
</body>
</html>
