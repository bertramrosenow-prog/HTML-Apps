   */
  const validate = obj => {
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return { ok: false, code: 'shape', detail: [], version: null };
    if (!obj.meta || typeof obj.meta !== 'object' || Array.isArray(obj.meta)) return { ok: false, code: 'missing', detail: ['meta'], version: null };
    if (obj.meta.app !== 'atlas-homecare') return { ok: false, code: 'app', detail: [String(obj.meta.app ?? '—')], version: null };
    const version = Number(obj.meta.schemaVersion);
    if (!Number.isInteger(version) || version < SCHEMA_MIN_SUPPORTED) return { ok: false, code: 'missing', detail: ['meta.schemaVersion'], version: null };
    if (version > SCHEMA_VERSION) return { ok: false, code: 'version', detail: [String(version)], version };

    const missing = [];
    if (!obj.settings || typeof obj.settings !== 'object' || Array.isArray(obj.settings)) missing.push('settings');
    if (!obj.home || typeof obj.home !== 'object' || Array.isArray(obj.home)) missing.push('home');
    COLLECTIONS.forEach(c => { if (!Array.isArray(obj[c])) missing.push(c); });
    if (missing.length) return { ok: false, code: 'missing', detail: missing, version };

    const bad = [];
    COLLECTIONS.forEach(coll => {
      const seen = new Set();
      const rules = FIELD_RULES[coll];
      obj[coll].forEach((rec, i) => {
        const at = coll + '[' + i + ']';
        if (!rec || typeof rec !== 'object' || Array.isArray(rec)) { bad.push(at + ' is not an object'); return; }
        if (typeof rec.id !== 'string' || !rec.id.trim()) { bad.push(at + '.id is missing'); return; }
        if (seen.has(rec.id)) { bad.push(at + '.id "' + rec.id + '" is duplicated'); return; }
        seen.add(rec.id);
        rules.dates.forEach(fld => {
          const val = rec[fld];
          if (val != null && val !== '' && !U.isDate(String(val))) bad.push(at + '.' + fld + ' = "' + val + '" is not a valid date');
        });
        rules.numbers.forEach(fld => {
          const val = rec[fld];
          if (val != null && val !== '' && !Number.isFinite(Number(val))) bad.push(at + '.' + fld + ' = "' + val + '" is not a number');
        });
        Object.entries(rules.enums).forEach(([fld, enumKey]) => {
          const val = rec[fld];
          if (val != null && val !== '' && !ENUM[enumKey].includes(String(val))) bad.push(at + '.' + fld + ' = "' + val + '" is not a known value');
        });
      });
    });
    if (bad.length) return { ok: false, code: 'records', detail: bad, version, count: bad.length };
    return { ok: true, code: null, detail: [], version };
  };

  /** Forward migration. Returns the number of the schema the data now speaks. */
  const migrate = data => {
    let from = Number(data.meta && data.meta.schemaVersion) || 1;
    if (from < 2) {
      (data.appliances || []).forEach(a => {
        if (!ENUM.applLifecycle.includes(a.lifecycle)) {
          const s = String(a.status || 'active');
          a.lifecycle = ['outOfService', 'replaced', 'archived'].includes(s) ? s : 'active';
        }
        if (!Array.isArray(a.serviceHistory)) a.serviceHistory = [];
        delete a.status;                                     // status is derived from now on
      });
      (data.projects || []).forEach(p => {
        if (!Array.isArray(p.contactIds)) p.contactIds = [];
        if (!Array.isArray(p.tasks)) p.tasks = [];
        if (!Array.isArray(p.materials)) p.materials = [];
        if (!ENUM.progressMode.includes(p.progressMode)) p.progressMode = p.tasks.length ? 'auto' : 'manual';
      });
      (data.costs || []).forEach(c => { if (c.sourceHistoryId == null) c.sourceHistoryId = ''; if (!c.sourceType) c.sourceType = 'manual'; });
      (data.maintenance || []).forEach(m => {
        if (!Array.isArray(m.history)) m.history = [];
        m.history.forEach(h => { if (!h.id) h.id = U.uid('h'); });
      });
      if (data.settings && data.settings.lastExportAt === undefined) data.settings.lastExportAt = null;
      from = 2;
    }
    data.meta.schemaVersion = from;
    return from;
  };

  /** Cleans, migrates and merges an unknown object onto the current defaults. */
  const normalise = raw => {
    const src = deepClean(raw) || {};
    if (!src.meta || typeof src.meta !== 'object') src.meta = {};
    COLLECTIONS.forEach(c => { if (!Array.isArray(src[c])) src[c] = []; });
    if (!src.settings || typeof src.settings !== 'object') src.settings = {};
    if (!src.home || typeof src.home !== 'object') src.home = {};
    migrate(src);
    const d = defaults();
    const out = {
      meta: { ...d.meta, ...src.meta, app: 'atlas-homecare', schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION },
      settings: { ...d.settings, ...src.settings },
      home: { ...d.home, ...src.home }
    };
    COLLECTIONS.forEach(c => { out[c] = src[c].filter(x => x && typeof x === 'object' && typeof x.id === 'string' && x.id); });
    if (!I18N.supported.includes(out.settings.language)) out.settings.language = I18N.get();
    if (!['light', 'dark', 'system'].includes(out.settings.theme)) out.settings.theme = 'system';
    out.settings.warrantyLeadDays = U.clamp(parseInt(out.settings.warrantyLeadDays, 10) || 60, 7, 365);
    return out;
  };

  /** Re-applies language and theme after a restore so the UI matches the data. */
  const applyEnvironment = () => {
    const s = state.settings || {};
    const th = s.theme || 'system';
    try { localStorage.setItem(LS_THEME, th); } catch {}
    const actual = th === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : th;
    document.documentElement.setAttribute('data-theme', actual);
    if (s.language && I18N.supported.includes(s.language) && s.language !== I18N.get()) I18N.set(s.language);
  };

  const load = () => {
    let raw = null;
    try { raw = localStorage.getItem(LS_DATA); } catch (e) { console.error(e); }
    if (!raw) { state = defaults(); return { fresh: true, migratedFrom: null }; }
    try {
      const parsed = JSON.parse(raw);
      const before = Number(parsed && parsed.meta && parsed.meta.schemaVersion) || 1;
      state = normalise(parsed);
      const migrated = before < SCHEMA_VERSION ? before : null;
      if (migrated) persist();                               // write the migrated shape back once
      return { fresh: false, migratedFrom: migrated };
    } catch (e) {
      console.error('[store] stored data could not be parsed, starting fresh', e);
      state = defaults();
      return { fresh: true, migratedFrom: null, error: true };
    }
  };

  const snapshot = () => JSON.parse(JSON.stringify(state));
  const markUndo = label => { lastSnapshot = { label, data: snapshot() }; };
  const canUndo = () => !!lastSnapshot;
  const undo = () => {
    if (!lastSnapshot) return false;
    state = lastSnapshot.data; lastSnapshot = null;
    persist(); applyEnvironment(); emit(); return true;
  };

  const upsert = (coll, obj) => {
    const list = state[coll];
    if (!Array.isArray(list)) return null;
    const idx = list.findIndex(x => x.id === obj.id);
    const now = U.nowIso();
    if (idx >= 0) list[idx] = { ...list[idx], ...obj, updatedAt: now };
    else list.push({ createdAt: now, updatedAt: now, ...obj });
    persist(); emit();
    return idx >= 0 ? list[idx] : list[list.length - 1];
  };
  /** Low-level removal. Use Relations.deleteWithRelations() for anything user-facing. */
  const remove = (coll, id, { undoLabel } = {}) => {
    const list = state[coll];
    const idx = list.findIndex(x => x.id === id);
    if (idx < 0) return false;
    if (undoLabel !== false) markUndo(undoLabel || 'delete');
    list.splice(idx, 1);
    persist(); emit();
    return true;
  };
  const byId = (coll, id) => (state[coll] || []).find(x => x.id === id) || null;
  const patchSettings = patch => { state.settings = { ...state.settings, ...patch }; persist(); emit(); };
  const patchHome = patch => { state.home = { ...state.home, ...patch }; persist(); emit(); };
  const replaceAll = raw => { state = normalise(raw); persist(); applyEnvironment(); emit(); };
  const wipe = () => { markUndo('reset'); state = defaults(); state.settings.onboarded = true; persist(); emit(); };
  const count = () => COLLECTIONS.reduce((a, c) => a + state[c].length, 0);
  /** Applies many changes with a single persist + a single re-render. */
  const batch = fn => { const r = fn(state); persist(); emit(); return r; };

  return {
    get state() { return state; },
    load, persist, subscribe, upsert, remove, byId, patchSettings, patchHome, batch,
    replaceAll, wipe, validate, normalise, migrate, snapshot, markUndo, undo, canUndo, count, defaults, applyEnvironment
  };
})();

const S = () => Store.state;
const cur = () => Store.state.settings.currency || 'EUR';
const lang = () => I18N.get();
const money = n => U.fmtMoney(n, cur(), lang());
const fdate = iso => U.fmtDate(iso, lang());
const fdateShort = iso => U.fmtDateShort(iso, lang());

// ═══════════════════════════════════════════════════════════════
// SELECTORS — derived state, the brain of the dashboard
// ═══════════════════════════════════════════════════════════════
const Sel = (() => {
  const active = list => list.filter(x => !x.archivedAt);

  /** Advances a due date until it is >= today (recurring tasks never show a stale date). */
  const nextDueFrom = (fromIso, m) => {
    const f = m.frequency;
    if (f === 'once') return null;
    if (f === 'weekly') return U.addDays(fromIso, 7);
    if (f === 'monthly') return U.addMonths(fromIso, 1);
    if (f === 'quarterly') return U.addMonths(fromIso, 3);
    if (f === 'halfYearly') return U.addMonths(fromIso, 6);
    if (f === 'yearly') return U.addMonths(fromIso, 12);
    if (f === 'custom') { const d = Math.max(1, parseInt(m.intervalDays, 10) || 30); return U.addDays(fromIso, d); }
    return null;
  };

  const maintStatus = m => {
    if (m.closedAt) return 'completed';
    if (m.paused) return 'paused';
    if (!U.isDate(m.nextDue)) return 'upcoming';
    const d = U.diffDays(U.today(), m.nextDue);
    if (d < 0) return 'overdue';
    if (d === 0) return 'dueToday';
    if (d <= 7) return 'dueSoon';
    return 'upcoming';
  };
  const maintOpen = () => active(S().maintenance).filter(m => !m.closedAt);
  const maintActive = () => maintOpen().filter(m => !m.paused);
  const maintOverdue = () => maintActive().filter(m => maintStatus(m) === 'overdue');
  const maintToday = () => maintActive().filter(m => maintStatus(m) === 'dueToday');
  const maintWithin = (from, to) => maintActive().filter(m => U.isDate(m.nextDue) && U.diffDays(U.today(), m.nextDue) >= from && U.diffDays(U.today(), m.nextDue) <= to);
  const maintDueThisMonth = () => {
    const ym = U.mstr(U.today());
    return maintActive().filter(m => U.isDate(m.nextDue) && U.mstr(m.nextDue) === ym && U.diffDays(U.today(), m.nextDue) >= 0);
  };
  const maintHistory = () => {
    const out = [];
    S().maintenance.forEach(m => (m.history || []).forEach(h => out.push({ ...h, taskId: m.id, taskTitle: m.title, category: m.category, roomId: m.roomId, applianceId: m.applianceId })));
    return U.sortBy(out, x => x.date).reverse();
  };

  const repairsOpen = () => S().repairs.filter(r => r.status !== 'completed' && r.status !== 'cancelled');
  /** A repair only "needs a decision" when nobody has decided what happens next. */
  const repairBadge = r => {
    if (['completed', 'cancelled'].includes(r.status)) return L.repairStatus(r.status);
    if (r.status === 'waiting' || r.status === 'commissioned') return L.repairStatus(r.status);
    if (!r.nextAction || !String(r.nextAction).trim()) return t('r.badge.decision');
    return L.repairStatus(r.status);
  };
  const repairBadgeTone = r => {
    if (r.status === 'completed') return 'ok';
    if (r.status === 'cancelled') return 'muted';
    if (!r.nextAction || !String(r.nextAction).trim()) return 'alert';
    if (r.status === 'waiting') return 'warn';
    if (r.status === 'commissioned') return 'info';
    return TONE[r.severity] || 'info';
  };
  const repairsUrgent = () => repairsOpen().filter(r => r.severity === 'urgent' || (U.isDate(r.targetDate) && U.diffDays(U.today(), r.targetDate) < 0));
  const repairsForAppliance = id => S().repairs.filter(r => r.applianceId === id);

  const projectsActive = () => S().projects.filter(p => ['planned', 'inProgress', 'waiting'].includes(p.status));
  const projectProgressMode = p => (p.tasks && p.tasks.length) ? 'auto' : 'manual';
  const projectProgress = p => {
    const tasks = p.tasks || [];
    if (projectProgressMode(p) === 'auto') return Math.round(tasks.filter(x => x.done).length / tasks.length * 100);
    return U.clamp(parseInt(p.progress, 10) || 0, 0, 100);
  };
  const projectSpent = p => U.sum(S().costs.filter(c => c.projectId === p.id), c => c.amount);

  const applianceLifecycle = a => ENUM.applLifecycle.includes(a.lifecycle) ? a.lifecycle : 'active';
  const appliancesTracked = () => S().appliances.filter(a => !['archived', 'replaced'].includes(applianceLifecycle(a)));
  const applianceNextService = a => {
    if (U.isDate(a.nextService)) return a.nextService;
    const months = parseInt(a.serviceIntervalMonths, 10);
    if (months > 0 && U.isDate(a.lastService)) return U.addMonths(a.lastService, months);
    return null;
  };
  /** Derived, never stored: an appliance cannot claim to be fine while its service is overdue. */
  const applianceStatus = a => {
    const lc = applianceLifecycle(a);
    if (lc !== 'active') return lc;
    const needsRepair = S().repairs.some(r => r.applianceId === a.id
      && !['completed', 'cancelled'].includes(r.status)
      && (r.severity === 'high' || r.severity === 'urgent'));
    if (needsRepair) return 'repairRequired';
    const d = applianceNextService(a);
    if (U.isDate(d)) {
      const diff = U.diffDays(U.today(), d);
      if (diff < 0) return 'serviceOverdue';
      if (diff <= 30) return 'serviceDueSoon';
    }
    return 'active';
  };
  const applianceServiceDue = () => appliancesTracked().filter(a => ['serviceDueSoon', 'serviceOverdue'].includes(applianceStatus(a)));
  const applianceServiceOverdue = () => appliancesTracked().filter(a => applianceStatus(a) === 'serviceOverdue');
  const applianceServiceHistory = a => U.sortBy(a.serviceHistory || [], h => h.date).reverse();
  /** lastService always mirrors the newest history entry. */
  const applianceLastServiceFrom = history => {
    const dates = (history || []).map(h => h.date).filter(U.isDate).sort();
    return dates.length ? dates[dates.length - 1] : '';
  };
  const applianceCost = id => U.sum(S().costs.filter(c => c.applianceId === id), c => c.amount);
  const warrantiesExpiring = (days) => {
    const lead = days != null ? days : (parseInt(S().settings.warrantyLeadDays, 10) || 60);
    return appliancesTracked()
      .filter(a => U.isDate(a.warrantyEnd))
      .map(a => ({ appliance: a, days: U.diffDays(U.today(), a.warrantyEnd) }))
      .filter(x => x.days >= 0 && x.days <= lead)
      .sort((a, b) => a.days - b.days);
  };

  const costsIn = (fromIso, toIso) => S().costs.filter(c => U.isDate(c.date) && c.date >= fromIso && c.date <= toIso);
  const costsThisYear = () => { const y = U.today().slice(0, 4); return S().costs.filter(c => (c.date || '').slice(0, 4) === y); };
  const costsThisMonth = () => { const ym = U.mstr(U.today()); return S().costs.filter(c => U.mstr(c.date) === ym); };
  const costsPlanned = () => {
    const m = U.sum(maintActive(), x => x.estimatedCost);
    const r = U.sum(repairsOpen(), x => (Number(x.actualCost) ? 0 : x.estimatedCost));
    const p = U.sum(projectsActive(), x => Math.max(0, (Number(x.budget) || 0) - projectSpent(x)));
    return m + r + p;
  };

  const roomName = id => { const r = Store.byId('rooms', id); return r ? r.name : null; };
  const applianceName = id => { const a = Store.byId('appliances', id); return a ? a.name : null; };
  const contactName = id => { const c = Store.byId('contacts', id); return c ? c.company : null; };
  const contactLinks = id => {
    const m = S().maintenance.filter(x => x.contactId === id).length;
    const r = S().repairs.filter(x => x.contactId === id).length;
    const a = S().appliances.filter(x => x.contactId === id).length;
    const p = S().projects.filter(x => (x.contactIds || []).includes(id)).length;
    return m + r + a + p;
  };

  /** All calendar entries in a date range, typed and colour-coded. */
  const calendarEntries = (fromIso, toIso) => {
    const out = [];
    maintOpen().forEach(m => {
      if (U.isDate(m.nextDue) && m.nextDue >= fromIso && m.nextDue <= toIso && !m.paused)
        out.push({ date: m.nextDue, type: 'maintenance', id: m.id, title: m.title, tone: TONE[maintStatus(m)] || 'info' });
    });
    appliancesTracked().forEach(a => {
      const d = applianceNextService(a);
      if (U.isDate(d) && d >= fromIso && d <= toIso)
        out.push({ date: d, type: 'service', id: a.id, title: a.name, tone: U.diffDays(U.today(), d) < 0 ? 'alert' : 'warn' });
      if (U.isDate(a.warrantyEnd) && a.warrantyEnd >= fromIso && a.warrantyEnd <= toIso)
        out.push({ date: a.warrantyEnd, type: 'warranty', id: a.id, title: a.name, tone: 'muted' });
    });
    repairsOpen().forEach(r => {
      if (U.isDate(r.targetDate) && r.targetDate >= fromIso && r.targetDate <= toIso)
        out.push({ date: r.targetDate, type: 'repair', id: r.id, title: r.title, tone: r.severity === 'urgent' ? 'alert' : 'warn' });
    });
    S().projects.filter(p => !['completed', 'cancelled'].includes(p.status)).forEach(p => {
      if (U.isDate(p.targetDate) && p.targetDate >= fromIso && p.targetDate <= toIso)
        out.push({ date: p.targetDate, type: 'project', id: p.id, title: p.title, tone: 'info' });
    });
    return U.sortBy(out, x => x.date + x.type);
  };

  /** Dashboard priority stack — the single most important computation in the app. */
  const priorities = () => {
    const out = [];
    const td = U.today();
    repairsUrgent().forEach(r => out.push({
      kind: 'repair', rank: 0, id: r.id, title: r.title,
      sub: r.nextAction ? '→ ' + r.nextAction : t('r.noNextAction'),
      badge: repairBadge(r), tone: repairBadgeTone(r), icon: 'alert-triangle'
    }));
    maintOverdue().forEach(m => out.push({
      kind: 'maintenance', rank: 1, id: m.id, title: m.title,
      sub: t('dash.overdueBy', { n: Math.abs(U.diffDays(td, m.nextDue)) }),
      badge: t('st.overdue'), tone: 'alert', icon: 'wrench'
    }));
    maintToday().forEach(m => out.push({
      kind: 'maintenance', rank: 2, id: m.id, title: m.title,
      sub: t('dash.dueToday'), badge: t('st.dueToday'), tone: 'alert', icon: 'wrench'
    }));
    maintWithin(1, 7).forEach(m => out.push({
      kind: 'maintenance', rank: 3, id: m.id, title: m.title,
      sub: U.diffDays(td, m.nextDue) === 1 ? t('dash.dueTomorrow') : t('dash.dueIn', { n: U.diffDays(td, m.nextDue) }),
      badge: t('st.dueSoon'), tone: 'warn', icon: 'wrench'
    }));
    maintWithin(8, 30).forEach(m => out.push({
      kind: 'maintenance', rank: 4, id: m.id, title: m.title,
      sub: t('dash.dueIn', { n: U.diffDays(td, m.nextDue) }),
      badge: t('st.upcoming'), tone: 'info', icon: 'wrench'
    }));
    applianceServiceOverdue().forEach(a => out.push({
      kind: 'appliance', rank: 2, id: a.id, title: a.name,
      sub: t('a.svc.overdueBy', { n: Math.abs(U.diffDays(U.today(), applianceNextService(a))) }),
      badge: t('as.serviceOverdue'), tone: 'alert', icon: 'package'
    }));
    warrantiesExpiring().forEach(w => out.push({
      kind: 'appliance', rank: 5, id: w.appliance.id, title: w.appliance.name,
      sub: t('dash.warrantyEndsIn', { n: w.days }), badge: t('cal.type.warranty'), tone: 'muted', icon: 'shield'
    }));
    return out.sort((a, b) => a.rank - b.rank);
  };

  const isEmptyHome = () => S().appliances.length === 0 && S().maintenance.length === 0 && S().repairs.length === 0 && S().projects.length === 0;

  return {
    nextDueFrom, maintStatus, maintOpen, maintActive, maintOverdue, maintToday, maintWithin, maintDueThisMonth, maintHistory,
    repairsOpen, repairsUrgent, repairsForAppliance, repairBadge, repairBadgeTone,
    projectsActive, projectProgress, projectSpent,
    appliancesTracked, applianceNextService, applianceStatus, applianceLifecycle, applianceServiceDue,
    applianceServiceOverdue, applianceServiceHistory, applianceLastServiceFrom, applianceCost, warrantiesExpiring,
    costsIn, costsThisYear, costsThisMonth, costsPlanned, roomName, applianceName, contactName, contactLinks,
    calendarEntries, priorities, isEmptyHome, projectProgressMode
  };
})();

// ═══════════════════════════════════════════════════════════════
// RELATIONS — one table describes every cross-reference in the app.
// Deleting anything goes through here so no orphaned id can survive.
// ═══════════════════════════════════════════════════════════════
const RELATIONS = {
  appliances: [
    { coll: 'maintenance', field: 'applianceId' },
    { coll: 'repairs', field: 'applianceId' },
    { coll: 'costs', field: 'applianceId' },
    { coll: 'docLocations', field: 'applianceId' }
  ],
  rooms: [
    { coll: 'maintenance', field: 'roomId' },
    { coll: 'repairs', field: 'roomId' },
    { coll: 'appliances', field: 'roomId' },
    { coll: 'projects', field: 'roomId' },
    { coll: 'costs', field: 'roomId' },
    { coll: 'materials', field: 'roomId' },
    { coll: 'notes', field: 'roomId' }
  ],
  contacts: [
    { coll: 'maintenance', field: 'contactId' },
    { coll: 'repairs', field: 'contactId' },
    { coll: 'appliances', field: 'contactId' },
    { coll: 'costs', field: 'contactId' },
    { coll: 'projects', field: 'contactIds', many: true },
    { coll: 'appliances', field: 'contactId', nested: 'serviceHistory', label: 'del.rel.serviceHistory' }
  ],
  projects: [
    { coll: 'costs', field: 'projectId' }
  ],
  maintenance: [], repairs: [], costs: [], utilities: [], materials: [], docLocations: [], notes: []
};

/** Which sourceType an auto-generated expense carries, per owning collection. */
const AUTO_SOURCE = { maintenance: 'maintenance', repairs: 'repair', appliances: 'applianceService' };

const Relations = (() => {
  const holdsRef = (rec, rel, id) => {
    if (rel.nested) return (rec[rel.nested] || []).some(child => child && child[rel.field] === id);
    if (rel.many) return Array.isArray(rec[rel.field]) && rec[rel.field].includes(id);
    return rec[rel.field] === id;
  };

  /** Everything that points at this record. */
  const scan = (coll, id) => {
    const groups = [];
    (RELATIONS[coll] || []).forEach(rel => {
      const hits = (S()[rel.coll] || []).filter(rec => holdsRef(rec, rel, id));
      if (!hits.length) return;
      const label = t(rel.label || ('del.rel.' + rel.coll));
      const found = groups.find(g => g.label === label);
      if (found) found.count += hits.length;
      else groups.push({ label, count: hits.length, effect: t('del.effect.unlink') });
    });
    const sourceType = AUTO_SOURCE[coll];
    const autoCosts = sourceType ? S().costs.filter(c => c.sourceType === sourceType && c.sourceId === id) : [];
    const total = groups.reduce((a, g) => a + g.count, 0) + autoCosts.length;
    return { groups, autoCosts, total };
  };

  /** Removes the record and every reference to it in one persisted step. */
  const purge = (coll, id, { deleteAutoCosts = false } = {}) => {
    Store.markUndo('delete:' + coll);
    let cleared = 0;
    Store.batch(st => {
      (RELATIONS[coll] || []).forEach(rel => {
        (st[rel.coll] || []).forEach(rec => {
          if (rel.nested) {
            (rec[rel.nested] || []).forEach(child => { if (child && child[rel.field] === id) { child[rel.field] = ''; cleared++; } });
          } else if (rel.many) {
            if (Array.isArray(rec[rel.field]) && rec[rel.field].includes(id)) { rec[rel.field] = rec[rel.field].filter(x => x !== id); cleared++; }
          } else if (rec[rel.field] === id) { rec[rel.field] = ''; cleared++; }
        });
      });
      const sourceType = AUTO_SOURCE[coll];
      if (sourceType) {
        if (deleteAutoCosts) {
          const before = st.costs.length;
          st.costs = st.costs.filter(c => !(c.sourceType === sourceType && c.sourceId === id));
          cleared += before - st.costs.length;
        } else {
          st.costs.forEach(c => {
            if (c.sourceType === sourceType && c.sourceId === id) { c.sourceType = 'manual'; c.sourceId = ''; c.sourceHistoryId = ''; cleared++; }
          });
        }
      }
      st[coll] = (st[coll] || []).filter(x => x.id !== id);
    });
    return cleared;
  };

  /** Debug/QA helper: every reference that points at a record which no longer exists. */
  const findOrphans = () => {
    const out = [];
    const ids = {};
    COLLECTIONS.forEach(c => { ids[c] = new Set(S()[c].map(x => x.id)); });
    Object.entries(RELATIONS).forEach(([target, rels]) => {
      rels.forEach(rel => {
        (S()[rel.coll] || []).forEach(rec => {
          const check = v => { if (v && !ids[target].has(v)) out.push(rel.coll + '.' + rel.field + ' -> ' + target + ':' + v); };
          if (rel.nested) (rec[rel.nested] || []).forEach(ch => check(ch && ch[rel.field]));
          else if (rel.many) (rec[rel.field] || []).forEach(check);
          else check(rec[rel.field]);
        });
      });
    });
    S().costs.forEach(c => {
      if (c.sourceType === 'maintenance' && c.sourceId && !ids.maintenance.has(c.sourceId)) out.push('costs.sourceId -> maintenance:' + c.sourceId);
      if (c.sourceType === 'repair' && c.sourceId && !ids.repairs.has(c.sourceId)) out.push('costs.sourceId -> repairs:' + c.sourceId);
      if (c.sourceType === 'applianceService' && c.sourceId && !ids.appliances.has(c.sourceId)) out.push('costs.sourceId -> appliances:' + c.sourceId);
    });
    return out;
  };

  return { scan, purge, findOrphans, RELATIONS };
})();

// ═══════════════════════════════════════════════════════════════
// LINKED COSTS — one completion always owns exactly one expense
// ═══════════════════════════════════════════════════════════════
const LinkedCost = (() => {
  const same = (c, key) => c.sourceType === key.sourceType && c.sourceId === key.sourceId
    && (c.sourceHistoryId || '') === (key.sourceHistoryId || '');

  const find = key => S().costs.find(c => same(c, key)) || null;

  /**
   * Creates, updates or removes the expense that belongs to one completion.
   * Passing amount 0/null deletes it. Never touches manually created expenses.
   */
  const upsert = (key, data) => {
    const existing = find(key);
    const amount = Number(data.amount);
    if (!Number.isFinite(amount) || amount <= 0) {
      if (existing) Store.remove('costs', existing.id, { undoLabel: false });
      return null;
    }
    const payload = {
      title: '', date: U.today(), type: 'other', roomId: '', applianceId: '', projectId: '', contactId: '', notes: '',
      ...data, amount,
      sourceType: key.sourceType, sourceId: key.sourceId, sourceHistoryId: key.sourceHistoryId || ''
    };
    if (existing) return Store.upsert('costs', { id: existing.id, ...payload });
    return Store.upsert('costs', { id: U.uid('k'), demo: !!data.demo, ...payload });
  };

  const drop = key => {
    const existing = find(key);
    if (!existing) return false;
    Store.remove('costs', existing.id, { undoLabel: false });
    return true;
  };

  const sumFor = key => { const c = find(key); return c ? Number(c.amount) || 0 : 0; };

  return { find, upsert, drop, sumFor };
})();

// ═══════════════════════════════════════════════════════════════
// ROUTER
// ═══════════════════════════════════════════════════════════════
const Router = (() => {
  const MODULES = ['dashboard', 'maintenance', 'appliances', 'repairs', 'projects', 'calendar', 'costs', 'contacts', 'records', 'settings'];
  const subs = new Set();
  const parse = hash => {
    const raw = (hash || location.hash || '').replace(/^#\/?/, '');
    const [path, query] = raw.split('?');
    const parts = path.split('/').filter(Boolean);
    const module = MODULES.includes(parts[0]) ? parts[0] : 'dashboard';
    const sub = parts[1] || '';
    const params = {};
    if (query) query.split('&').forEach(kv => { const [k, v] = kv.split('='); if (k) params[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
    return { module, sub, params };
  };
  const stringify = ({ module, sub, params }) => {
    let s = '#/' + module + (sub ? '/' + sub : '');
    const q = Object.entries(params || {}).filter(([, v]) => v != null && v !== '').map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v));
    if (q.length) s += '?' + q.join('&');
    return s;
  };
  let current = parse();
  const go = to => {
    const route = typeof to === 'string' ? parse(to.startsWith('#') ? to : '#/' + to) : { module: 'dashboard', sub: '', params: {}, ...to };
    const next = stringify(route);
    if (location.hash === next) { current = route; subs.forEach(cb => cb(current)); }
    else location.hash = next;
  };
  const handle = () => { current = parse(location.hash); subs.forEach(cb => { try { cb(current); } catch (e) { console.error(e); } }); };
  window.addEventListener('hashchange', handle);
  return { parse, stringify, go, get: () => ({ ...current }), sub: cb => { subs.add(cb); return () => subs.delete(cb); }, MODULES, handle };
})();

// ═══════════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════════
const Toast = (() => {
  const root = () => document.getElementById('toast-root');
  const show = (msg, kind = 'info', ms = 3200, action = null) => {
    const el = U.h('div.toast.toast--' + kind);
    el.appendChild(U.h('span.toast-msg', null, msg));
    let closed = false;
    const close = () => {
      if (closed) return; closed = true;
      el.style.transition = 'opacity 180ms, transform 180ms';
      el.style.opacity = '0'; el.style.transform = 'translateX(20px)';
      setTimeout(() => el.remove(), 200);
    };
    if (action) el.appendChild(U.h('button.toast-action', { type: 'button', onClick: () => { action.onClick(); close(); } }, action.label));
    else el.addEventListener('click', close);
    root().appendChild(el);
    setTimeout(close, ms);
    return close;
  };
  const undoable = (msg, onUndo) => show(msg, 'info', 6000, { label: t('c.undo'), onClick: onUndo });
  return { show, undoable };
})();

// ═══════════════════════════════════════════════════════════════
// A11Y — focus trapping, inert background, scroll locking.
// Shared by the modal, the slide-over panel, the search overlay
// and the mobile navigation drawer.
// ═══════════════════════════════════════════════════════════════
const A11y = (() => {
  const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
  const backgroundRoots = () => ['sidebar', 'app-shell', 'sidebar-backdrop'].map(id => document.getElementById(id)).filter(Boolean);

  let inertDepth = 0;
  const pushInert = () => {
    inertDepth++;
    if (inertDepth === 1) backgroundRoots().forEach(el => { el.inert = true; el.setAttribute('aria-hidden', 'true'); });
  };
  const popInert = () => {
    inertDepth = Math.max(0, inertDepth - 1);
    if (inertDepth === 0) backgroundRoots().forEach(el => { el.inert = false; el.removeAttribute('aria-hidden'); });
  };

  let scrollDepth = 0;
  const lockScroll = () => { scrollDepth++; if (scrollDepth === 1) document.body.style.overflow = 'hidden'; };
  const unlockScroll = () => { scrollDepth = Math.max(0, scrollDepth - 1); if (scrollDepth === 0) document.body.style.overflow = ''; };

  const focusables = container => Array.from(container.querySelectorAll(FOCUSABLE))
    .filter(el => !el.hasAttribute('hidden') && el.getClientRects().length > 0);

  /** Call from a keydown handler; keeps Tab inside `container`. */
  const trap = (e, container) => {
    if (e.key !== 'Tab') return;
    const items = focusables(container);
    if (!items.length) { e.preventDefault(); return; }
    const first = items[0], last = items[items.length - 1];
    if (!container.contains(document.activeElement)) { e.preventDefault(); first.focus(); return; }
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };

  const focusFirst = (container, preferred) => {
    const el = (preferred && container.querySelector(preferred)) || focusables(container)[0];
    if (el) { try { el.focus(); } catch {} }
  };

  const restoreFocus = el => {
    if (el && document.contains(el) && typeof el.focus === 'function') { try { el.focus(); } catch {} }
  };

  return { FOCUSABLE, pushInert, popInert, lockScroll, unlockScroll, focusables, trap, focusFirst, restoreFocus };
})();

// ═══════════════════════════════════════════════════════════════
// MODAL + FORM
// ═══════════════════════════════════════════════════════════════
const Modal = (() => {
  const stack = [];
  const root = () => document.getElementById('modal-root');

  const close = () => {
    const top = stack.pop();
    if (!top) return;
    window.removeEventListener('keydown', top.esc);
    top.backdrop.remove();
    A11y.popInert(); A11y.unlockScroll();
    A11y.restoreFocus(top.prevFocus);
  };
  const closeAll = () => { while (stack.length) close(); };

  const open = ({ title, subtitle, body, actions = [], size = '', onClose, footerLeft }) => {
    const prevFocus = document.activeElement;
    const titleId = 'mt-' + U.uid();
    const modal = U.h('div.modal' + (size ? '.modal--' + size : ''), { role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': titleId });
    const head = U.h('div.modal-header', {}, [
      U.h('div', {}, [U.h('h2.modal-title', { id: titleId }, title || ''), subtitle ? U.h('div.modal-subtitle', null, subtitle) : null]),
      U.h('button.btn.btn--icon.btn--sm.btn--ghost', { type: 'button', 'aria-label': t('c.close'), onClick: () => { close(); if (onClose) onClose(); } }, U.icon('x', 15))
    ]);
    modal.appendChild(head);
    modal.appendChild(U.h('div.modal-body', {}, body instanceof Node ? body : U.h('div', null, String(body ?? ''))));
    if (actions.length || footerLeft) {
      const foot = U.h('div.modal-footer' + (footerLeft ? '.modal-footer--split' : ''));
      if (footerLeft) foot.appendChild(footerLeft);
      const grp = U.h('div', { style: { display: 'flex', gap: 'var(--s-2)', flexWrap: 'wrap' } });
      actions.forEach(a => {
        const btn = U.h('button.btn' + (a.primary ? '.btn--primary' : a.danger ? '.btn--danger' : ''), { type: 'button' }, a.label);
        let busy = false;
        // Guards against a double click submitting (and duplicating) the same record twice.
        btn.addEventListener('click', async () => {
          if (busy) return;
          busy = true; btn.disabled = true;
          try {
            const r = a.onClick ? await a.onClick() : undefined;
            if (r !== false) close();
          } finally {
            busy = false;
            if (btn.isConnected) btn.disabled = false;
          }
        });
        grp.appendChild(btn);
      });
      foot.appendChild(grp);
      modal.appendChild(foot);
    }
    const backdrop = U.h('div.modal-backdrop', { onMousedown: e => { if (e.target === backdrop) { close(); if (onClose) onClose(); } } }, modal);
    const esc = e => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); if (onClose) onClose(); }
      else A11y.trap(e, modal);
    };
    window.addEventListener('keydown', esc);
    root().appendChild(backdrop);
    A11y.pushInert(); A11y.lockScroll();
    stack.push({ backdrop, esc, prevFocus });
    setTimeout(() => A11y.focusFirst(modal, 'input:not([type="hidden"]), textarea, select'), 50);
    return { close, el: modal };
  };

  const confirm = ({ title, message, confirmLabel, danger = false, onConfirm }) => open({
    title: title || t('c.confirm'),
    body: U.h('p', { style: { color: 'var(--color-ink-1)', lineHeight: '1.6', margin: '0 0 4px' } }, message),
    actions: [
      { label: t('c.cancel') },
      { label: confirmLabel || t('c.confirm'), primary: !danger, danger, onClick: async () => { if (onConfirm) await onConfirm(); } }
    ]
  });

  return { open, close, closeAll, confirm };
})();

/**
 * Declarative form builder used by every create/edit dialog.
 * field: {name,label,type,value,options,required,hint,placeholder,col2,min,max,step,rows,readonly}
 * type: text | textarea | number | money | date | select | checkbox | rating | year
 */
const Form = (() => {
  /** Builds one labelled control and registers it in `refs`. */
  const buildField = (f, refs) => {
      const wrap = U.h('div' + (f.col2 || f.type === 'textarea' || f.type === 'checkbox' ? '.col-2' : ''));
      const id = 'f-' + U.uid();
      let input;
      if (f.type === 'textarea') {
        input = U.h('textarea.textarea', { id, rows: f.rows || 3, placeholder: f.placeholder || '' });
        input.value = f.value ?? '';
      } else if (f.type === 'select') {
        input = U.h('select.select', { id }, [
          f.allowEmpty !== false ? U.h('option', { value: '' }, f.emptyLabel || ('— ' + t('c.none') + ' —')) : null,
          ...(f.options || []).map(o => U.h('option', { value: String(o.value) }, o.label))
        ]);
        input.value = f.value != null ? String(f.value) : '';
      } else if (f.type === 'checkbox') {
        input = U.h('input', { type: 'checkbox', id });
        input.checked = !!f.value;
      } else if (f.type === 'rating') {
        input = U.h('select.select', { id }, [
          U.h('option', { value: '' }, t('ct.rating.none')),
          ...[1, 2, 3, 4, 5].map(n => U.h('option', { value: String(n) }, '★'.repeat(n)))
        ]);
        input.value = f.value ? String(f.value) : '';
      } else {
        const type = f.type === 'money' || f.type === 'number' || f.type === 'year' ? 'number' : f.type === 'date' ? 'date' : f.type === 'email' ? 'email' : f.type === 'tel' ? 'tel' : 'text';
        input = U.h('input.input', { type, id, placeholder: f.placeholder || '', step: f.step || (f.type === 'money' ? '0.01' : null), min: f.min, max: f.max });
        input.value = f.value != null ? String(f.value) : '';
      }
      if (f.readonly) input.setAttribute('readonly', 'readonly');
      const err = U.h('div.field-error', { id: id + '-err', hidden: true, role: 'alert' });
      const describedBy = [];
      if (f.type === 'checkbox') {
        wrap.appendChild(U.h('label.checkline', { htmlFor: id }, [input, U.h('span', null, f.label)]));
      } else {
        wrap.appendChild(U.h('label.label', { htmlFor: id }, f.label + (f.required ? ' *' : '')));
        wrap.appendChild(input);
      }
      if (f.required) input.setAttribute('aria-required', 'true');
      if (f.hint) {
        const hintEl = U.h('div.field-hint', { id: id + '-hint' }, f.hint);
        wrap.appendChild(hintEl);
        describedBy.push(id + '-hint');
      }
      describedBy.push(id + '-err');
      input.setAttribute('aria-describedby', describedBy.join(' '));
      wrap.appendChild(err);
      refs[f.name] = { input, err, def: f };
      return wrap;
  };

  const build = fields => {
    const grid = U.h('form.form-grid', { novalidate: 'novalidate', onSubmit: e => e.preventDefault() });
    const refs = {};
    fields.forEach(f => {
      if (!f) return;
      if (f.type === 'section') { grid.appendChild(U.h('div.form-section-title', null, f.label)); return; }
      if (f.type === 'node') { const n = U.h('div.col-2', {}, f.node); grid.appendChild(n); return; }
      if (f.type === 'disclosure') {
        const box = U.h('div.disclosure');
        const body = U.h('div.disclosure-body', { hidden: true });
        const toggleId = 'dsc-' + U.uid();
        const chev = U.icon('chevron-down', 13);
        const toggle = U.h('button.disclosure-toggle', {
          type: 'button', 'aria-expanded': 'false', 'aria-controls': toggleId,
          onClick: () => {
            const open = body.hidden;
            body.hidden = !open;
            toggle.setAttribute('aria-expanded', String(open));
            U.clear(labelSpan).appendChild(document.createTextNode(open ? t('c.hideDetails') : t('c.showDetails')));
            chev.style.transform = open ? 'rotate(180deg)' : '';
          }
        });
        const labelSpan = U.h('span', null, f.label || t('c.showDetails'));
        toggle.appendChild(chev); toggle.appendChild(labelSpan);
        body.id = toggleId;
        (f.fields || []).forEach(sub => { if (sub) body.appendChild(buildField(sub, refs)); });
        box.appendChild(toggle); box.appendChild(body);
        grid.appendChild(box);
        return;
      }
      grid.appendChild(buildField(f, refs));
    });
    return { grid, refs };
  };

  const read = refs => {
    const data = {};
    for (const [k, r] of Object.entries(refs)) {
      const f = r.def;
      if (f.type === 'checkbox') data[k] = r.input.checked;
      else if (f.type === 'money' || f.type === 'number' || f.type === 'year' || f.type === 'rating') {
        const v = r.input.value.trim();
        data[k] = v === '' ? null : Number(v);
      } else data[k] = r.input.value.trim();
    }
    return data;
  };

  const validate = (refs, data) => {
    let ok = true, firstBad = null;
    for (const [k, r] of Object.entries(refs)) {
      const f = r.def;
      r.err.hidden = true; r.input.removeAttribute('aria-invalid');
      let msg = null;
      const val = data[k];
      if (f.required && (val === '' || val == null || (typeof val === 'number' && isNaN(val)))) msg = t('c.required');
      else if (f.type === 'date' && val && !U.isDate(val)) msg = t('c.invalidDate');
      else if ((f.type === 'money' || f.type === 'number' || f.type === 'year') && val != null && isNaN(val)) msg = t('c.invalidNumber');
      else if (f.validate) msg = f.validate(val, data) || null;
      if (msg) {
        ok = false; r.err.textContent = msg; r.err.hidden = false;
        r.input.setAttribute('aria-invalid', 'true');
        if (!firstBad) firstBad = r.input;
      }
    }
    if (firstBad) firstBad.focus();
    return ok;
  };

  /** Opens a modal containing the form. onSubmit(data) → return false to keep it open. */
  const open = ({ title, subtitle, fields, submitLabel, onSubmit, size = 'lg', notice, extraActions = [], footerLeft }) => {
    const { grid, refs } = build(fields);
    const body = U.h('div');
    if (notice) body.appendChild(U.h('div.notice', { style: { marginBottom: 'var(--s-4)' } }, [U.icon('alert-triangle', 16), U.h('span', null, notice)]));
    body.appendChild(grid);
    const submit = async () => {
      const data = read(refs);
      if (!validate(refs, data)) return false;
      const r = await onSubmit(data);
      return r;
    };
    grid.addEventListener('submit', async e => { e.preventDefault(); const r = await submit(); if (r !== false) Modal.close(); });
    return Modal.open({
      title, subtitle, body, size, footerLeft,
      actions: [...extraActions, { label: t('c.cancel') }, { label: submitLabel || t('c.save'), primary: true, onClick: submit }]
    });
  };

  return { open, build, read, validate };
})();

// ═══════════════════════════════════════════════════════════════
// PICKER — anchored searchable list with an inline "create new"
// ═══════════════════════════════════════════════════════════════
const Picker = (() => {
  let pop = null, escH = null, clickH = null, opener = null;

  const close = () => {
    if (!pop) return;
    pop.remove(); pop = null;
    window.removeEventListener('keydown', escH); escH = null;
    window.removeEventListener('click', clickH); clickH = null;
    if (opener) { opener.setAttribute('aria-expanded', 'false'); A11y.restoreFocus(opener); opener = null; }
  };

  const open = ({ anchor, items, onSelect, onCreate, placeholder, selectedId, emptyLabel }) => {
    close();
    opener = anchor || null;
    let query = '';
    let filtered = (items || []).slice();
    let active = 0;

    const listId = 'pick-' + U.uid();
    const input = U.h('input.input', { type: 'text', placeholder: placeholder || t('c.search'), autocomplete: 'off',
      'aria-label': placeholder || t('c.search'), role: 'combobox', 'aria-expanded': 'true', 'aria-controls': listId, 'aria-autocomplete': 'list' });
    const rows = U.h('div', { id: listId, role: 'listbox', style: { maxHeight: '260px', overflowY: 'auto' } });

    const renderRows = () => {
      U.clear(rows);
      if (!filtered.length) {
        rows.appendChild(U.h('div.picker-empty', null, emptyLabel || t('c.noResults')));
        if (onCreate && query.trim()) {
          rows.appendChild(U.h('button.picker-row', { type: 'button', dataset: { active: 'true' },
            onClick: () => { const v = query.trim(); close(); onCreate(v); } },
            [U.icon('plus', 14), U.h('span', null, t('p.newProvider') + ': “' + query.trim() + '”')]));
        }
        return;
      }
      filtered.forEach((it, i) => {
        const row = U.h('button.picker-row' + (it.id === selectedId ? '.picker-row--selected' : ''), {
          type: 'button', role: 'option', 'aria-selected': String(it.id === selectedId),
          dataset: { active: i === active ? 'true' : 'false' },
          onClick: () => { close(); onSelect(it); }
        });
        if (it.icon) row.appendChild(U.icon(it.icon, 14));
        row.appendChild(U.h('span', { style: { flex: '1' } }, it.label));
        if (it.sub) row.appendChild(U.h('span.picker-sub', null, it.sub));
        rows.appendChild(row);
      });
    };

    const doFilter = () => {
      const q = query.trim().toLowerCase();
      filtered = q ? (items || []).filter(it => (it.label || '').toLowerCase().includes(q) || (it.sub || '').toLowerCase().includes(q)) : (items || []).slice();
      active = Math.min(active, Math.max(0, filtered.length - 1));
      renderRows();
    };

    input.addEventListener('input', e => { query = e.target.value; doFilter(); });
    input.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(filtered.length - 1, active + 1); renderRows(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active - 1); renderRows(); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        if (filtered[active]) { const it = filtered[active]; close(); onSelect(it); }
        else if (onCreate && query.trim()) { const v = query.trim(); close(); onCreate(v); }
      }
    });

    pop = U.h('div.popover', { role: 'dialog', 'aria-label': placeholder || t('c.search') }, [
      U.h('div.picker-search', {}, input), rows
    ]);
    document.body.appendChild(pop);
    renderRows();

    const r = anchor ? anchor.getBoundingClientRect() : { bottom: 80, top: 80, left: 40, width: 240 };
    const pr = pop.getBoundingClientRect();
    let top = r.bottom + 6, left = r.left;
    if (top + pr.height > window.innerHeight - 8) top = Math.max(8, r.top - pr.height - 6);
    if (left + pr.width > window.innerWidth - 8) left = Math.max(8, window.innerWidth - pr.width - 8);
    pop.style.top = Math.max(8, top) + 'px';
    pop.style.left = Math.max(8, left) + 'px';
    if (anchor) anchor.setAttribute('aria-expanded', 'true');

    escH = e => {
      if (e.key === 'Escape') { e.preventDefault(); close(); }
      else A11y.trap(e, pop);
    };
    const openedAt = Date.now();
    clickH = e => {
      if (Date.now() - openedAt < 120) return;
      if (pop && !pop.contains(e.target) && e.target !== anchor) close();
    };
    setTimeout(() => { window.addEventListener('keydown', escH); window.addEventListener('click', clickH); input.focus(); }, 0);
  };

  return { open, close };
})();

// ═══════════════════════════════════════════════════════════════
// SLIDE-OVER PANEL (record detail)
// ═══════════════════════════════════════════════════════════════
const Panel = (() => {
  let openState = null;
  const root = () => document.getElementById('panel-root');
  const close = () => {
    if (!openState) return;
    window.removeEventListener('keydown', openState.esc);
    U.clear(root());
    A11y.popInert(); A11y.unlockScroll();
    A11y.restoreFocus(openState.prevFocus);
    openState = null;
  };
  const open = ({ title, subtitle, body, actions = [] }) => {
    close();
    const prevFocus = document.activeElement;
    const panel = U.h('aside.panel', { role: 'dialog', 'aria-modal': 'true', 'aria-label': title });
    panel.appendChild(U.h('div.panel-header', {}, [
      U.h('div', { style: { minWidth: '0' } }, [U.h('h2.modal-title', null, title), subtitle ? U.h('div.modal-subtitle', null, subtitle) : null]),
      U.h('button.btn.btn--icon.btn--sm.btn--ghost', { type: 'button', 'aria-label': t('c.close'), onClick: close }, U.icon('x', 15))
    ]));
    panel.appendChild(U.h('div.panel-body', {}, body));
    if (actions.length) {
      panel.appendChild(U.h('div.panel-footer', {}, actions.map(a =>
        U.h('button.btn' + (a.primary ? '.btn--primary' : a.danger ? '.btn--danger' : ''), { type: 'button', onClick: () => { const r = a.onClick && a.onClick(); if (r !== false) close(); } }, a.label)
      )));
    }
    const backdrop = U.h('div.panel-backdrop', { onClick: close });
    const esc = e => {
      if (e.key === 'Escape') { e.preventDefault(); close(); }
      else A11y.trap(e, panel);
    };
    window.addEventListener('keydown', esc);
    U.clear(root()); root().appendChild(backdrop); root().appendChild(panel);
    A11y.pushInert(); A11y.lockScroll();
    openState = { esc, prevFocus };
    setTimeout(() => A11y.focusFirst(panel), 50);
  };
  return { open, close };
})();

    const existing = document.querySelector('.popover[data-menu="true"]');
    if (existing) { existing.remove(); anchor.setAttribute('aria-expanded', 'false'); return; }
    const pop = U.h('div.popover', { dataset: { menu: 'true' }, role: 'menu' });

      pop.remove();

      window.removeEventListener('keydown', escH); window.removeEventListener('click', clickH);
      A11y.restoreFocus(anchor);
    };
    document.body.appendChild(pop);
    const r = anchor.getBoundingClientRect(), pr = pop.getBoundingClientRect();
    let top = r.bottom + 6, left = Math.min(r.left, window.innerWidth - pr.width - 8);

    const wrap = U.h('div.chart-bars');
    data.forEach(d => {

      col.appendChild(U.h('div.chart-x', null, d.label));
      wrap.appendChild(col);

  };

  /** Horizontal category breakdown. data: [{label, value, color}] */
  const catBars = (data, fmt) => {

    U.append(el, children);
    return el;

  const stars = n => n ? '★'.repeat(n) + '☆'.repeat(5 - n) : t('ct.rating.none');

  return { statusChip, demoBadge, pageHeader, btn, iconBtn, empty, card, cardLink, kpi, row, metaBits, segmented, menu, filterChips, notice, bar, ring, barChart, catBars, kvList, sectionTitle, listGroup, stars };

const libText = (item, field) => { const i = { en: 0, de: 1, es: 2 }[I18N.get()] ?? 0; return (item[field] || [])[i] || (item[field] || [])[0] || ''; };

// ═══════════════════════════════════════════════════════════════
// LIBRARY SCHEDULING — seasonal tasks land in their season, the rest
// is spread out so a fresh setup never produces a wall of due dates.
// ═══════════════════════════════════════════════════════════════
const SEASONAL_DUE = {
  'heat-service': '09-01', 'heat-bleed': '09-15', 'chimney': '10-01',
  'gutters': '10-01', 'roof-visual': '04-01', 'drain-outside': '10-15',
  'facade': '05-01', 'windows-seal': '09-15', 'window-hinges': '09-01', 'exterior-paint': '06-01',
  'hedge': '03-01', 'outdoor-tap': '10-15', 'terrace': '04-15', 'garden-tools': '03-15',
  'meter-reading': '12-20', 'insurance-review': '01-15'
};
const nextSeasonal = md => {
  const y = new Date().getFullYear();
  let d = y + '-' + md;
  if (!U.isDate(d)) return null;
  if (U.diffDays(U.today(), d) < 5) d = (y + 1) + '-' + md;
  return d;
};
/** Returns { libKey: 'YYYY-MM-DD' } with no two tasks landing on the same day. */
const planFirstDues = items => {
  const used = new Set(S().maintenance.map(m => m.nextDue).filter(U.isDate));
  const base = { weekly: 4, monthly: 7, quarterly: 17, halfYearly: 33, yearly: 51, custom: 59, once: 11 };
  const step = { weekly: 2, monthly: 3, quarterly: 6, halfYearly: 9, yearly: 12, custom: 14, once: 5 };
  const seen = {};
  const out = {};
  items.forEach(item => {
    let d = SEASONAL_DUE[item.key] ? nextSeasonal(SEASONAL_DUE[item.key]) : null;
    if (!d) {
      const f = item.freq || 'yearly';
      seen[f] = seen[f] || 0;
      d = U.addDays(U.today(), (base[f] ?? 30) + seen[f] * (step[f] ?? 7));
      seen[f]++;
    }
    let guard = 0;
    while (used.has(d) && guard++ < 90) d = U.addDays(d, 1);
    used.add(d);
    out[item.key] = d;
  });
  return out;
};

// ACTIONS — create / edit / complete / delete for every record type
// ═══════════════════════════════════════════════════════════════
const Act = (() => {
  const afterSave = msg => { Toast.show(msg || t('c.saved'), 'ok'); };

  // ── Deletion: never leaves an orphaned reference behind ──────
  const deleteRecord = (coll, id, name, onDone) => {
    const scan = Relations.scan(coll, id);
    const body = U.h('div');
    body.appendChild(U.h('p', { style: { color: 'var(--color-ink-1)', lineHeight: '1.6', marginTop: '0' } },
      scan.total ? t('del.intro.linked', { n: scan.total }) : t('del.intro.none')));

    if (scan.groups.length) {
      const list = U.h('div.rel-list');
      scan.groups.forEach(g => list.appendChild(U.h('div.rel-item', {}, [
        U.h('span', null, g.label),
        U.h('span', {}, [U.h('span.rel-count', null, String(g.count)), U.h('span.rel-effect', null, ' · ' + g.effect)])
      ])));
      body.appendChild(list);
    }

    let costBox = null;
    if (scan.autoCosts.length) {
      const sum = money(U.sum(scan.autoCosts, c => c.amount));
      const list = U.h('div.rel-list');
      list.appendChild(U.h('div.rel-item', {}, [
        U.h('span', null, t('del.rel.costsAuto')),
        U.h('span', {}, [U.h('span.rel-count', null, String(scan.autoCosts.length)), U.h('span.rel-effect', null, ' · ' + t('del.effect.costKeep'))])
      ]));
      body.appendChild(list);
      const cbId = 'delcost-' + U.uid();
      costBox = U.h('input', { type: 'checkbox', id: cbId });
      body.appendChild(U.h('label.checkline', { htmlFor: cbId, style: { marginTop: 'var(--s-3)' } },
        [costBox, U.h('span', null, t('del.alsoDeleteCosts', { n: scan.autoCosts.length, sum }))]));
    }

    Modal.open({
      title: t('del.title', { name }),
      body,
      actions: [
        { label: t('c.cancel') },
        { label: t('del.confirm'), danger: true, onClick: () => {
          const cleared = Relations.purge(coll, id, { deleteAutoCosts: !!(costBox && costBox.checked) });
          Toast.undoable(cleared ? t('del.done', { name, n: cleared }) : t('del.doneSimple', { name }),
            () => { if (Store.undo()) Toast.show(t('c.restored'), 'ok'); });
          if (onDone) onDone();
        } }
      ]
    });
  };

  // ── Maintenance ─────────────────────────────────────────────
  const maintenanceForm = (existing, presets = {}) => {
    const m = existing || {};
    const isNew = !existing;
    Form.open({
      title: isNew ? t('m.add') : t('c.edit') + ' — ' + m.title,
      subtitle: isNew ? t('m.sub') : null,
      size: 'lg',
      fields: [
        { name: 'title', label: t('c.title'), type: 'text', value: m.title || presets.title || '', required: true, col2: true, placeholder: t('m.addShort') },
        { name: 'description', label: t('c.description'), type: 'textarea', value: m.description || presets.description || '', rows: 2 },
        { name: 'category', label: t('c.category'), type: 'select', value: m.category || presets.category || 'general', options: opts(ENUM.maintCat, L.maintCat), required: true, allowEmpty: false },
        { name: 'priority', label: t('c.priority'), type: 'select', value: m.priority || 'normal', options: opts(ENUM.priority, L.priority), allowEmpty: false },
        { name: 'roomId', label: t('c.room'), type: 'select', value: m.roomId || presets.roomId || '', options: roomOptions() },
        { name: 'applianceId', label: t('c.appliance'), type: 'select', value: m.applianceId || presets.applianceId || '', options: applianceOptions() },
        { name: 'freqSection', type: 'section', label: t('m.field.frequency') },
        { name: 'frequency', label: t('m.field.frequency'), type: 'select', value: m.frequency || presets.frequency || 'yearly', options: opts(ENUM.frequency, L.frequency), required: true, allowEmpty: false },
        { name: 'intervalDays', label: t('m.field.interval'), type: 'number', value: m.intervalDays ?? presets.intervalDays ?? '', min: 1, hint: t('fr.custom'),
          validate: (v, d) => (d.frequency === 'custom' && (!v || v < 1)) ? t('c.required') : null },
        { name: 'lastCompleted', label: t('m.field.lastDone'), type: 'date', value: m.lastCompleted || '', readonly: !isNew && (m.history || []).length > 0,
          hint: (!isNew && (m.history || []).length) ? t('m.history') : null },
        { name: 'nextDue', label: t('m.field.nextDue'), type: 'date', value: m.nextDue || presets.nextDue || U.today(), required: true },
        { name: 'planSection', type: 'section', label: t('c.cost') + ' · ' + t('c.assigned') },
        { name: 'estimatedCost', label: t('c.estCost'), type: 'money', value: m.estimatedCost ?? '', min: 0 },
        { name: 'assignee', label: t('m.field.assignee'), type: 'text', value: m.assignee || '' },
        { name: 'contactId', label: t('c.provider'), type: 'select', value: m.contactId || '', options: contactOptions(), col2: true },
        { name: 'notes', label: t('c.notes'), type: 'textarea', value: m.notes || '', rows: 2 }
      ],
      notice: t('m.safety'),
      submitLabel: isNew ? t('c.add') : t('c.save'),
      onSubmit: data => {
        if (!isNew && (m.history || []).length) data.lastCompleted = m.lastCompleted;
        Store.upsert('maintenance', { id: m.id || U.uid('m'), history: m.history || [], closedAt: m.closedAt || null, paused: m.paused || false, demo: m.demo || false, ...data });
        afterSave();
      }
    });
  };

  /** Recomputes lastCompleted / nextDue / closedAt from the completion history. */
  const recalcMaintenance = (m, history) => {
    const dates = (history || []).map(h => h.date).filter(U.isDate).sort();
    const last = dates.length ? dates[dates.length - 1] : '';
    const patch = { id: m.id, history, lastCompleted: last };
    if (m.frequency === 'once') {
      patch.closedAt = last || null;
      patch.nextDue = m.nextDue;
    } else {
      patch.closedAt = null;
      if (last) {
        let next = Sel.nextDueFrom(last, m);
        let guard = 0;
        while (next && U.diffDays(U.today(), next) < 0 && guard++ < 200) next = Sel.nextDueFrom(next, m);
        patch.nextDue = next || m.nextDue;
      } else {
        patch.nextDue = m.nextDue;
      }
    }
    return patch;
  };

  /** One dialog for both "complete" and "edit an existing completion". */
  const completeMaintenance = (m, onDone, entry) => {
    const editing = !!entry;

        { name: 'notes', label: t('c.notes'), type: 'textarea', value: u.notes || '', rows: 2 }
      ],
      notice: t('hr.util.noSecrets'),
      onSubmit: data => { Store.upsert('utilities', { id: u.id || U.uid('u'), demo: u.demo || false, ...data }); afterSave(); }
    });
  };

  const materialForm = existing => {
    const m = existing || {};
    Form.open({
      title: m.id ? t('c.edit') : t('hr.mat.add'),
      size: 'lg',
      fields: [
        { name: 'name', label: t('c.name'), type: 'text', value: m.name || '', required: true, col2: true },
        { name: 'brand', label: t('hr.mat.brand'), type: 'text', value: m.brand || '' },
        { name: 'code', label: t('hr.mat.code'), type: 'text', value: m.code || '' },
        { name: 'where', label: t('hr.mat.where'), type: 'text', value: m.where || '' },
        { name: 'roomId', label: t('c.room'), type: 'select', value: m.roomId || '', options: roomOptions() },
        { name: 'date', label: t('c.date'), type: 'date', value: m.date || '', col2: true },
        { name: 'notes', label: t('c.notes'), type: 'textarea', value: m.notes || '', rows: 2 }
      ],
      onSubmit: data => { Store.upsert('materials', { id: m.id || U.uid('mt'), demo: m.demo || false, ...data }); afterSave(); }
    });
  };

  const docForm = existing => {
    const d = existing || {};
    Form.open({
      title: d.id ? t('c.edit') : t('hr.docs.add'),
      size: 'lg',
      fields: [
        { name: 'what', label: t('hr.docs.what'), type: 'text', value: d.what || '', required: true, col2: true },
        { name: 'where', label: t('hr.docs.where'), type: 'text', value: d.where || '', required: true, col2: true },
        { name: 'applianceId', label: t('c.appliance'), type: 'select', value: d.applianceId || '', options: applianceOptions(), col2: true },
        { name: 'notes', label: t('c.notes'), type: 'textarea', value: d.notes || '', rows: 2 }
      ],
      notice: t('hr.util.noSecrets'),
      onSubmit: data => { Store.upsert('docLocations', { id: d.id || U.uid('d'), demo: d.demo || false, ...data }); afterSave(); }
    });
  };

  const noteForm = existing => {
    const n = existing || {};
    Form.open({
      title: n.id ? t('c.edit') : t('hr.notes.add'),
      size: 'lg',
      fields: [
        { name: 'title', label: t('c.title'), type: 'text', value: n.title || '', required: true, col2: true },
        { name: 'body', label: t('c.description'), type: 'textarea', value: n.body || '', rows: 5 },
        { name: 'roomId', label: t('c.room'), type: 'select', value: n.roomId || '', options: roomOptions(), col2: true }
      ],
      onSubmit: data => { Store.upsert('notes', { id: n.id || U.uid('n'), demo: n.demo || false, ...data }); afterSave(); }
    });
  };

  // ── Starter library picker (shared by Settings and Onboarding) ──
  const libraryPicker = ({ compact = false, openFirst = true, preselect = [] } = {}) => {
    const existingKeys = new Set(S().maintenance.map(m => m.libKey).filter(Boolean));
    const planned = planFirstDues(LIBRARY);
    const chosen = new Map();                     // libKey -> { item, dateInput }
    const rows = new Map();                       // libKey -> { cb, dateInput, body }
    const root = U.h('div');
    root.appendChild(C.notice(t('lib.notice')));
    const summary = U.h('div.onb-summary');
    const renderSummary = () => {
      U.clear(summary);
      if (!chosen.size) { summary.appendChild(U.h('span.meta', null, t('onb.4.none'))); return; }
      const dates = Array.from(chosen.values()).map(v => v.dateInput.value).filter(U.isDate).sort();
      summary.appendChild(U.h('strong', { style: { color: 'var(--color-accent-ink)' } },
        t('onb.4.selectedInfo', { n: chosen.size, from: fdateShort(dates[0]), to: fdateShort(dates[dates.length - 1]) })));
    };
    root.appendChild(summary);

    const list = U.h('div' + (compact ? '.onb-scroll' : ''));
    ENUM.maintCat.forEach((cat, ci) => {
      const items = LIBRARY.filter(x => x.cat === cat);
      if (!items.length) return;
      const wrap = U.h('div.lib-cat');
      const body = U.h('div', { hidden: !(openFirst && ci === 0) });
      const chev = U.icon('chevron-down', 14);
      if (body.hidden) chev.style.transform = 'rotate(-90deg)';
      const hdr = U.h('button.lib-cat-hdr', {
        type: 'button', 'aria-expanded': String(!body.hidden),
        onClick: () => {
          const open = body.hidden;
          body.hidden = !open;
          hdr.setAttribute('aria-expanded', String(open));
          chev.style.transform = open ? '' : 'rotate(-90deg)';
        }
      }, [chev, U.h('span', { style: { flex: '1' } }, L.maintCat(cat)), U.h('span.chip-count', null, String(items.length))]);
      wrap.appendChild(hdr);

      items.forEach(item => {
        const already = existingKeys.has(item.key);
        const cbId = 'lib-' + item.key;
        const cb = U.h('input', { type: 'checkbox', id: cbId, disabled: already || null });
        const title = libText(item, 't');
        const desc = libText(item, 'd');
        const freqLabel = item.freq === 'custom' && item.interval ? t('c.days', { n: item.interval }) : L.frequency(item.freq);
        const dateInput = U.h('input.input', {
          type: 'date', hidden: true,
          'aria-label': t('m.field.firstDue') + ' — ' + title,
          style: { maxWidth: '160px', marginTop: '6px' }
        });
        dateInput.value = planned[item.key] || U.addDays(U.today(), 14);
        dateInput.addEventListener('change', renderSummary);
        cb.addEventListener('change', () => {
          if (cb.checked) { chosen.set(item.key, { item, dateInput }); dateInput.hidden = false; }
          else { chosen.delete(item.key); dateInput.hidden = true; }
          renderSummary();
        });
        const label = U.h('label', { htmlFor: cbId }, [
          U.h('div.lib-item-title', null, title),
          U.h('div.lib-item-sub', null, freqLabel + (desc ? ' · ' + desc : '')),
          U.h('div.lib-item-sub', null, [
            item.pro ? U.h('span.status.status--warn', null, t('lib.pro')) : null,
            U.h('span', { style: { marginLeft: item.pro ? '6px' : '0' } }, t('lib.firstDue', { date: fdateShort(planned[item.key]) }))
          ]),
          already ? U.h('div.lib-item-sub', { style: { color: 'var(--color-ok)' } }, '✓ ' + t('lib.alreadyAdded')) : null
        ]);
        const row = U.h('div.lib-item', {}, [cb, U.h('div', { style: { flex: '1', minWidth: '0' } }, [label, dateInput])]);
        rows.set(item.key, { cb, dateInput, body, hdr });
        body.appendChild(row);
      });
      wrap.appendChild(body);
      list.appendChild(wrap);
    });
    root.appendChild(list);
    // Restore a previous selection (used when stepping back and forth in onboarding).
    (preselect || []).forEach(sel => {
      const row = rows.get(sel.key);
      if (!row || row.cb.disabled) return;
      row.cb.checked = true;
      if (U.isDate(sel.date)) row.dateInput.value = sel.date;
      row.dateInput.hidden = false;
      chosen.set(sel.key, { item: LIBRARY.find(x => x.key === sel.key), dateInput: row.dateInput });
      if (row.body.hidden) { row.body.hidden = false; row.hdr.setAttribute('aria-expanded', 'true'); }
    });
    renderSummary();

    return {
      node: root,
      count: () => chosen.size,
      selection: () => Array.from(chosen.entries()).map(([key, v]) => ({ key, item: v.item, date: v.dateInput.value }))
    };
  };

  /** Turns a picker selection into real maintenance records. */
  const applyLibrarySelection = selection => {
    let n = 0;
    selection.forEach(({ item, date }) => {
      Store.upsert('maintenance', {
        id: U.uid('m'), libKey: item.key,
        title: libText(item, 't'), description: libText(item, 'd'),
        category: item.cat, frequency: item.freq, intervalDays: item.interval || null,
        priority: item.pro ? 'high' : 'normal',
        roomId: '', applianceId: '', contactId: '', assignee: '', estimatedCost: null,
        nextDue: U.isDate(date) ? date : U.addDays(U.today(), 14),
        lastCompleted: '', notes: '', history: [], paused: false, closedAt: null
      });
      n++;
    });
    return n;
  };

  const openLibrary = onDone => {
    const picker = libraryPicker({ compact: false });
    Modal.open({
      title: t('lib.title'), subtitle: t('lib.spread'), size: 'lg', body: picker.node,
      actions: [
        { label: t('c.cancel') },
        { label: t('lib.addSelected'), primary: true, onClick: () => {
          if (!picker.count()) { Toast.show(t('lib.none'), 'warn'); return false; }
          const n = applyLibrarySelection(picker.selection());
          Toast.show(t('lib.added', { n }), 'ok');
          if (onDone) onDone();
        } }
      ]
    });
  };

  return {
    deleteRecord, maintenanceForm, completeMaintenance, deleteMaintenanceHistory, recalcMaintenance, toggleMaintenancePause,
    applianceForm, completeApplianceService, deleteApplianceService,
    repairForm, completeRepair, reopenRepair,
    projectForm, linkProjectContact, unlinkProjectContact,
    contactForm, costForm,
    homeProfileForm, roomForm, utilityForm, materialForm, docForm, noteForm,
    openLibrary, libraryPicker, applyLibrarySelection
  };
})();

const Views = {};
const COST_COLOR = type => 'var(--chart-' + (ENUM.costType.includes(type) ? type : 'other') + ')';
const goto = (module, sub, params) => Router.go({ module, sub: sub || '', params: params || {} });

/** Opens the right record dialog for a priority / calendar / search hit. */
const openRecord = (kind, id) => {
  if (kind === 'maintenance') { const m = Store.byId('maintenance', id); if (m) Views.maintenanceDetail(m); }
  else if (kind === 'repair') { const r = Store.byId('repairs', id); if (r) Views.repairDetail(r); }
  else if (kind === 'appliance' || kind === 'service' || kind === 'warranty') { const a = Store.byId('appliances', id); if (a) Views.applianceDetail(a); }
  else if (kind === 'project') { const p = Store.byId('projects', id); if (p) Views.projectDetail(p); }
  else if (kind === 'contact') { const c = Store.byId('contacts', id); if (c) Act.contactForm(c); }
  else if (kind === 'room') goto('records', 'rooms');
  else if (kind === 'cost') { const k = Store.byId('costs', id); if (k) Act.costForm(k); }
};
